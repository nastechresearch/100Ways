# Transcribed verbatim from the fork's own release surface, so the Store credential
# gate is tested against the lane the sync ships and not against a list written next
# to it.  Source measured on 2026-10-25: ``origin/main``
# .github/workflows/desktop-bundled-release.yml -- job ``stable-store`` at 2477, its
# credential ``env`` at 2487-2497, the ``msstore reconfigure`` step at 2513, the job
# ending at 2529.  Re-check with
#   git show origin/main:.github/workflows/desktop-bundled-release.yml | sed -n '2477,2529p'
# Only the wrapper the workflow parser needs (``name``/``on``/``jobs``) is added here;
# every line inside the job is the fork's shipped text, byte for byte.
#
# Why this fixture exists: ``MS_STORE_SELLER_ID`` (2494, consumed at 2513 as
# ``--sellerId``) was the name the engine's Store gate left out, and
# ``hundredways.pubconfig`` classified it ``ungated-consumed`` -- the verdict that
# means a run can be admitted while the job reads an empty string.
name: Desktop Bundled Release
on:
  workflow_dispatch:
    inputs:
      tag:
        type: string
      release-phase:
        type: string
      skip-store:
        type: boolean
      manifest-sha256:
        type: string
jobs:
  stable-store:
    name: Submit the verified Store package
    needs: [validate, stable-publish]
    if: inputs.release-phase == 'publish' && inputs.skip-store != true
    # The Store is not a release gate: a failed submission leaves the release publishable
    # and the summary names the Store package for a manual Partner Center upload.
    continue-on-error: true
    runs-on: windows-latest
    environment: release-signing
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_COMMIT: ${{ needs.validate.outputs.sha }}
      NASTECH_ARCHIVE_TAG: ${{ needs.validate.outputs.archive-tag }}
      CANDIDATE_MANIFEST_SHA256: ${{ inputs.manifest-sha256 }}
      CLOUDFLARE_R2_PUBLIC_URL: ${{ vars.CLOUDFLARE_R2_PUBLIC_URL }}
      MS_STORE_TENANT_ID: ${{ secrets.MS_STORE_TENANT_ID }}
      MS_STORE_SELLER_ID: ${{ secrets.MS_STORE_SELLER_ID }}
      MS_STORE_CLIENT_ID: ${{ secrets.MS_STORE_CLIENT_ID }}
      MS_STORE_CLIENT_SECRET: ${{ secrets.MS_STORE_CLIENT_SECRET }}
      MS_STORE_PRODUCT_ID: ${{ vars.MS_STORE_PRODUCT_ID }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
      - uses: ./.github/actions/setup-pm
        with:
          cache-python: false
      - name: Retrieve the exact Store candidate
        shell: bash
        run: python -m scripts.bundles.release_artifacts materialize --root verified --store-only
      - uses: microsoft/microsoft-store-apppublisher@cc9910a8d59f2eb55cbb83df0a3800cf3b5300e0 # v1.4
      - name: Submit without rebuilding
        shell: bash
        run: |
          test -n "$MS_STORE_PRODUCT_ID"
          msstore reconfigure --tenantId "$MS_STORE_TENANT_ID" --sellerId "$MS_STORE_SELLER_ID" --clientId "$MS_STORE_CLIENT_ID" --clientSecret "$MS_STORE_CLIENT_SECRET"
          files=(verified/Store-*.msixbundle)
          test "${#files[@]}" -eq 1
          test -f "${files[0]}"
          # Auto-publish stays off: the submission is committed with
          # targetPublishMode Manual and is released by the publication pass.
          python -m scripts.releases.store submit "${files[0]}"
      - name: Name the Store package for a manual upload
        if: failure()
        shell: bash
        run: |
          name=$(cd verified 2>/dev/null && ls Store-*.msixbundle 2>/dev/null | head -1)
          base="${CLOUDFLARE_R2_PUBLIC_URL%/}/releases/tag/$NASTECH_ARCHIVE_TAG"
          url="$base/${name:-handoff-windows-universal.json}"
          msg="Store submission failed; the release is still publishable. Upload this package in Partner Center: $url"
          echo "::warning title=Microsoft Store::$msg"
          { echo "## Microsoft Store: manual upload needed"; echo; echo "$msg"; } >> "$GITHUB_STEP_SUMMARY"
