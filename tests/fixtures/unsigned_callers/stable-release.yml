jobs:
  candidates-darwin-arm64:
    name: Build signed release candidates (darwin-arm64)
    needs: admit
    # Starts with the gates; the acceptance join is what requires CI.
    if: >-
      !cancelled() && needs.admit.result == 'success' && fromJSON(needs.admit.outputs.jobs)['candidates-darwin-arm64']
    permissions:
      contents: write
      actions: read
      packages: write
      id-token: write
    uses: ./.github/workflows/desktop-bundled-release.yml
    secrets: inherit
    with:
      tag: ${{ needs.admit.outputs.tag }}
      claim-tag: ${{ needs.admit.outputs.claim-tag }}
      claim-object: ${{ needs.admit.outputs.claim-object }}
      release-phase: candidate
      jobs: darwin-arm64
      skip-tests: ${{ !fromJSON(needs.admit.outputs.lanes).smoke }}

  candidates-darwin-x64:
    name: Build signed release candidates (darwin-x64)
    needs: admit
    # Starts with the gates; the acceptance join is what requires CI.
    # macOS Intel is off by default: unsupported on main, and its macos-15-intel
    # runner adds over an hour to the release.
    if: >-
      !cancelled() && needs.admit.result == 'success' && fromJSON(needs.admit.outputs.jobs)['candidates-darwin-x64']
    permissions:
      contents: write
      actions: read
      packages: write
      id-token: write
    uses: ./.github/workflows/desktop-bundled-release.yml
    secrets: inherit
    with:
      tag: ${{ needs.admit.outputs.tag }}
      claim-tag: ${{ needs.admit.outputs.claim-tag }}
      claim-object: ${{ needs.admit.outputs.claim-object }}
      release-phase: candidate
      jobs: darwin-x64
      skip-tests: ${{ !fromJSON(needs.admit.outputs.lanes).smoke }}

  candidates-win32-arm64:
    name: Build signed release candidates (win32-arm64)
    needs: admit
    # Starts with the gates; the acceptance join is what requires CI.
    if: >-
      !cancelled() && needs.admit.result == 'success' && fromJSON(needs.admit.outputs.jobs)['candidates-win32-arm64']
    permissions:
      contents: write
      actions: read
      packages: write
      id-token: write
    uses: ./.github/workflows/desktop-bundled-release.yml
    secrets: inherit
    with:
      tag: ${{ needs.admit.outputs.tag }}
      claim-tag: ${{ needs.admit.outputs.claim-tag }}
      claim-object: ${{ needs.admit.outputs.claim-object }}
      release-phase: candidate
      jobs: win32-arm64
      skip-tests: ${{ !fromJSON(needs.admit.outputs.lanes).smoke }}
      skip-signed: ${{ !fromJSON(needs.admit.outputs.lanes).windows }}
      skip-store: ${{ !fromJSON(needs.admit.outputs.lanes)['windows-store'] }}
      windows-smokes-with-bundle: true

  candidates-win32-x64:
    name: Build signed release candidates (win32-x64)
    needs: admit
    # Starts with the gates; the acceptance join is what requires CI.
    if: >-
      !cancelled() && needs.admit.result == 'success' && fromJSON(needs.admit.outputs.jobs)['candidates-win32-x64']
    permissions:
      contents: write
      actions: read
      packages: write
      id-token: write
    uses: ./.github/workflows/desktop-bundled-release.yml
    secrets: inherit
    with:
      tag: ${{ needs.admit.outputs.tag }}
      claim-tag: ${{ needs.admit.outputs.claim-tag }}
      claim-object: ${{ needs.admit.outputs.claim-object }}
      release-phase: candidate
      jobs: win32-x64
      skip-tests: ${{ !fromJSON(needs.admit.outputs.lanes).smoke }}
      skip-signed: ${{ !fromJSON(needs.admit.outputs.lanes).windows }}
      skip-store: ${{ !fromJSON(needs.admit.outputs.lanes)['windows-store'] }}
      windows-smokes-with-bundle: true

  candidates-win32-bundle:
    name: Build signed release candidates (win32-bundle)
    needs: [admit, candidates-win32-arm64, candidates-win32-x64]
    # Starts with the gates; the acceptance join is what requires CI.
    if: >-
      !cancelled() && needs.admit.result == 'success' && fromJSON(needs.admit.outputs.jobs)['candidates-win32-bundle']
      && needs.candidates-win32-arm64.result == 'success'
      && needs.candidates-win32-x64.result == 'success'
    permissions:
      contents: write
      actions: read
      packages: write
      id-token: write
    uses: ./.github/workflows/desktop-bundled-release.yml
    secrets: inherit
    with:
      tag: ${{ needs.admit.outputs.tag }}
      claim-tag: ${{ needs.admit.outputs.claim-tag }}
      claim-object: ${{ needs.admit.outputs.claim-object }}
      release-phase: candidate
      jobs: win32-bundle
      skip-tests: ${{ !fromJSON(needs.admit.outputs.lanes).smoke }}
      skip-signed: ${{ !fromJSON(needs.admit.outputs.lanes).windows }}
      skip-store: ${{ !fromJSON(needs.admit.outputs.lanes)['windows-store'] }}
      windows-smokes-with-bundle: true

  candidates-termux:
    name: Build signed release candidates (termux)
    needs: admit
    # Starts with the gates; the acceptance join is what requires CI.
    # Termux is off by default.
    if: >-
      !cancelled() && needs.admit.result == 'success' && fromJSON(needs.admit.outputs.jobs)['candidates-termux']
    permissions:
      contents: write
      actions: read
      packages: write
      id-token: write
    uses: ./.github/workflows/desktop-bundled-release.yml
    secrets: inherit
    with:
      tag: ${{ needs.admit.outputs.tag }}
      claim-tag: ${{ needs.admit.outputs.claim-tag }}
      claim-object: ${{ needs.admit.outputs.claim-object }}
      release-phase: candidate
      jobs: termux
      skip-tests: ${{ !fromJSON(needs.admit.outputs.lanes).smoke }}

