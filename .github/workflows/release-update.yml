name: release-update

# Build a fully branded Nastech project from the real Hermes upstream and
# release it as a zip.  The zip contains exactly:
#   nastech-agent/          1 project folder (the branded, verified tree)
#   UPDATE-REPORT.md        2 markdown reports, OUTSIDE the project folder
#   GATE-REPORT.md
#
# Runs the 15-stage pipeline: pull -> census -> plan -> brand -> scan ->
# compare -> verify -> report -> package -> manifest -> record -> notify ->
# gate -> summary -> release.  The gate must PASS (>=99% file-to-file parity,
# no hard failures) or the release is not created.

on:
  workflow_dispatch:
    inputs:
      hermes_url:
        description: "Hermes upstream URL (default: NousResearch/hermes-agent)"
        required: false
        default: "https://github.com/NousResearch/hermes-agent.git"
  schedule:
    - cron: "0 3 * * 1" # every Monday 03:00 UTC

permissions:
  contents: write

concurrency:
  group: release-update
  cancel-in-progress: false

jobs:
  build-branded-zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.2.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install 100ways
        run: pip install -e .

      - name: Run the 15-stage update pipeline
        id: update
        env:
          HUNDREDWAYS_HERMES_URL: ${{ github.event.inputs.hermes_url || 'https://github.com/NousResearch/hermes-agent.git' }}
          HUNDREDWAYS_UPDATES_DIR: Updates-Commits
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
        run: |
          100ways update \
            --updates-dir "$HUNDREDWAYS_UPDATES_DIR" \
            --hermes-url "$HUNDREDWAYS_HERMES_URL" \
            --zip "Updates-Commits/nastech-agent-update.zip" \
            --project-name nastech-agent
          echo "sha=$(git -C Updates-Commits/hermes-agent rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "number=$(ls Updates-Commits | grep -c '^Nastech-Update#')" >> "$GITHUB_OUTPUT"

      - name: Verify zip layout
        run: |
          python3 - <<'EOF'
          import zipfile
          with zipfile.ZipFile("Updates-Commits/nastech-agent-update.zip") as zf:
              names = zf.namelist()
          top = sorted(set(n.split("/", 1)[0] for n in names))
          assert "nastech-agent" in top, top
          assert "UPDATE-REPORT.md" in names, "report 1 missing from zip root"
          assert "GATE-REPORT.md" in names, "report 2 missing from zip root"
          assert not any(n.startswith("nastech-agent/") and n.endswith("REPORT.md") for n in names), \
              "reports must live OUTSIDE the project folder"
          print("zip layout OK:", top)
          EOF

      - name: Push branded tree to test branch + open PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          BASE="nastech-update"
          TEST="test/update-latest"
          SHA="${{ steps.update.outputs.sha }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ! git show-ref --verify --quiet "refs/remotes/origin/$BASE"; then
            git fetch origin main
            git branch "$BASE" origin/main
            git push origin "$BASE"
          fi

          git fetch origin "$BASE"
          git checkout -B "$TEST" "origin/$BASE"
          rm -rf -- nastech-agent reports 2>/dev/null || true

          mkdir -p extract
          python3 - <<'EOF'
          import zipfile, os
          with zipfile.ZipFile("Updates-Commits/nastech-agent-update.zip") as zf:
              for name in zf.namelist():
                  if name.endswith("UPDATE-REPORT.md"):
                      os.makedirs("extract/reports", exist_ok=True)
                      with open("extract/reports/UPDATE-REPORT.md", "wb") as fh:
                          fh.write(zf.read(name))
                  elif name.endswith("GATE-REPORT.md"):
                      os.makedirs("extract/reports", exist_ok=True)
                      with open("extract/reports/GATE-REPORT.md", "wb") as fh:
                          fh.write(zf.read(name))
              zf.extractall("extract")
          EOF
          mv extract/nastech-agent ./nastech-agent
          mv extract/reports ./reports

          git add -A
          git -c user.name="github-actions[bot]" \
             -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
             commit -m "chore: branded update (${SHA:0:8})" || echo "nothing to commit"
          git push --force origin "$TEST"

          PR_TITLE="Update (${SHA:0:8})"
          BODY="Pipeline gate: PASS. Auto-generated from the 100Ways release pipeline."
          PR_URL=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$TEST" --base "$BASE" --json url --jq '.[0].url' 2>/dev/null) || true
          if [ -n "$PR_URL" ]; then
            gh pr edit "$PR_URL" --title "$PR_TITLE" --body "$BODY" 2>/dev/null || true
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base "$BASE" --head "$TEST" \
              --title "$PR_TITLE" --body "$BODY"
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/release-notes.md <<'MD'
          ## Nastech branded project from Hermes upstream

          - upstream sha: ${{ steps.update.outputs.sha }}
          - pipeline: 15 ordered stages, gate must pass
          - zip: `nastech-agent/` project folder + `UPDATE-REPORT.md` + `GATE-REPORT.md`

          Auto-generated by 100Ways.
          MD
          TAG="update-${{ steps.update.outputs.sha }}"
          gh release create "$TAG" \
            "Updates-Commits/nastech-agent-update.zip" \
            --title "Nastech Update #${{ steps.update.outputs.number }} (${{ steps.update.outputs.sha }})" \
            --notes-file /tmp/release-notes.md
