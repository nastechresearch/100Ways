name: weekly-sync

# Weekly full-sync cron. Runs Sunday 03:00 UTC and uses the same 19-stage
# pipeline as the main CI path. Differs from ci.yml in two ways:
#   * always runs (no commit-threshold gate)
#   * never publishes a PR (#344 lives in ci.yml)
# The output is a sanitized weekly report uploaded as an artifact and a
# Telegram notification if TELEGRAM_BOT_TOKEN is configured.

on:
  schedule:
    - cron: "0 3 * * 0"  # Sundays 03:00 UTC
  workflow_dispatch:
    inputs:
      bootstrap:
        description: Accept the first large upstream jump with review_required
        type: boolean
        required: false
        default: false
      dry_run:
        description: Skip Telegram notification and artifact upload
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  weekly-sync:
    name: Weekly full-sync plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.2.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install 100Ways
        run: pip install -e .

      - name: Install ripgrep for the search prerequisite
        run: |
          set -euo pipefail
          RG_VERSION=15.1.0
          RG_SHA256=1c9297be4a084eea7ecaedf93eb03d058d6faae29bbc57ecdaf5063921491599
          RG_TARBALL=ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl.tar.gz
          curl -sSfL --retry 3 --retry-delay 5 -o "$RG_TARBALL" \
            "https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}/${RG_TARBALL}"
          echo "${RG_SHA256}  ${RG_TARBALL}" | sha256sum -c -
          tar -xzf "$RG_TARBALL"
          sudo mv "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl/rg" /usr/local/bin/rg
          rm -rf "$RG_TARBALL" "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl"

      - name: Shallow clone of the fork (owned-assets registry)
        run: |
          git clone --depth=1 \
            https://github.com/nastechresearch/nastech-agent.git nastech-agent

      - name: Capture direct upstream SHA
        id: direct-source
        run: |
          set -euo pipefail
          DIRECT_SHA=$(git ls-remote https://github.com/NousResearch/hermes-agent.git HEAD | awk 'NR == 1 {print $1}')
          test -n "$DIRECT_SHA"
          echo "sha=$DIRECT_SHA" >> "$GITHUB_OUTPUT"

      - name: Build weekly report
        env:
          HUNDREDWAYS_STATE_DIR: ${{ runner.temp }}/100ways-state
          HUNDREDWAYS_WEEKLY_REPORT: ${{ runner.temp }}/weekly-full-sync-report.md
          HUNDREDWAYS_DECISION: ${{ runner.temp }}/weekly-decision.json
          EXPECTED_UPSTREAM_SHA: ${{ steps.direct-source.outputs.sha }}
        run: |
          set -euo pipefail
          # The weekly cron never runs the 19-stage pipeline (that lives in
          # ci.yml); it only audits the current upstream HEAD against the
          # last ledger entry and writes a plan-only report.
          python3 - <<'PYEOF'
          import json
          import os
          from hundredways.weekly_sync import build_weekly_report, write_weekly_report

          # Use a synthetic branded_root = nastech-agent's shallow clone.
          # This is a PLAN-ONLY report; it does not modify nastech-agent.
          report = build_weekly_report(
              "nastech-agent",
              "nastech-agent",
              os.environ["HUNDREDWAYS_STATE_DIR"],
              mode="plan",
              expected_upstream_sha=os.environ["EXPECTED_UPSTREAM_SHA"],
              bootstrap=${{ inputs.bootstrap || 'false' }},
          )
          write_weekly_report(os.environ["HUNDREDWAYS_WEEKLY_REPORT"], report)
          with open(os.environ["HUNDREDWAYS_DECISION"], "w", encoding="utf-8") as fh:
              json.dump(report.to_dict(), fh, indent=2)
          print(f"Gate: {report.to_dict()['gate']}")
          print(f"Review required: {report.review_required}")
          PYEOF

      - name: Upload weekly report
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: weekly-full-sync-report
          path: |
            ${{ runner.temp }}/weekly-full-sync-report.md
            ${{ runner.temp }}/weekly-decision.json
          if-no-files-found: warn

      - name: Notify Telegram
        if: ${{ !inputs.dry_run && secrets.TELEGRAM_BOT_TOKEN != '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HUNDREDWAYS_DECISION: ${{ runner.temp }}/weekly-decision.json
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import json
          import os
          import urllib.request

          with open(os.environ["HUNDREDWAYS_DECISION"], encoding="utf-8") as fh:
              decision = json.load(fh)
          gate = decision.get("gate", "?")
          review = "YES" if decision.get("review_required") else "NO"
          upstream = (decision.get("upstream_sha") or "?")[:12]
          commits = decision.get("commits", 0)
          body = (
              "NASTECH / 100WAYS\n"
              "WEEKLY SYNC PLAN\n"
              "────────────────\n"
              f"Gate      {gate}\n"
              f"Review    {review}\n"
              f"Upstream  {upstream}\n"
              f"Commits   {commits} since last ledger entry\n"
              "\nPlan-only: no PR is published by this workflow. "
              "Trigger ci.yml with workflow_dispatch to actually publish."
          )
          req = urllib.request.Request(
              f"https://api.telegram.org/bot{os.environ['TELEGRAM_BOT_TOKEN']}/sendMessage",
              data=json.dumps({
                  "chat_id": os.environ["TELEGRAM_CHAT_ID"],
                  "text": body,
              }).encode("utf-8"),
              headers={"Content-Type": "application/json"},
          )
          urllib.request.urlopen(req, timeout=30).read()
          print("Telegram notification sent")
          PYEOF
