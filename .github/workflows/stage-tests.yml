name: stage-tests

# Stage 2: the full pytest suite (no writes to ~/.nastech).  It runs on the
# package's declared dependencies plus pytest and pyyaml: the release-lane
# tests load the reconciled release workflow as YAML, so that a corrupted
# env block is caught instead of passing as a text blob.  No other services
# are needed.

on:
  workflow_call:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.2.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install 100ways + test dependencies
        run: |
          pip install -e .
          pip install "pytest>=7,<9" "pyyaml>=6,<7"

      - name: Fetch the fork's release surface
        # The lane reconcile is only worth having if it reproduces the tree the
        # fork ships, so compare against nastech-agent's own files instead of
        # only against the fixtures below.  These are every path the two lane
        # rules read or write; a full checkout of the fork is ~290 MB.
        run: |
          set -euo pipefail
          tree=build/nastech-agent
          fetch() {
            mkdir -p "$tree/$(dirname "$1")"
            curl -fsSL "https://raw.githubusercontent.com/nastechresearch/nastech-agent/main/$1" \
              -o "$tree/$1"
          }
          for path in scripts/releases/lanes.py scripts/releases/stable.py \
                     scripts/releases/store.py scripts/releases/entrypoint.py \
                     .github/workflows/stable-release.yml \
                     tests/scripts/test_release_lanes.py \
                     tests/scripts/test_release_channels.py \
                     tests/scripts/test_stable_release.py \
                     tests/scripts/test_release_entrypoint.py; do
            fetch "$path"
          done
          # A tree synced before upstream's lane table carries optional_platforms.py
          # instead; whichever shape the fork has moved past is simply absent.
          curl -fsSL "https://raw.githubusercontent.com/nastechresearch/nastech-agent/main/scripts/releases/optional_platforms.py" \
            -o "$tree/scripts/releases/optional_platforms.py" || true

      - name: Fork release-surface drift
        # Advisory, and deliberately not part of the gate below: a lane-policy
        # change lands in 100Ways before the sync that carries it into the fork,
        # so during that window the fork's shipped tree is *expected* not to be a
        # fixed point of the new rules. Blocking on it would turn every engine PR
        # after a policy change red until a release landed; the check exists to
        # make the drift visible instead of silent.
        env:
          NASTECH_AGENT_TREE: ${{ github.workspace }}/build/nastech-agent
        continue-on-error: true
        run: |
          python3 -m pytest tests/test_signing_gated_lanes.py -q \
            -k "real_fork" --no-header

      - name: Run test suite
        run: |
          python3 -m pytest tests/ -q
