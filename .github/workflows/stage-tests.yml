name: stage-tests

# Stage 2: the full pytest suite (stdlib + pytest only, no network, no
# writes to ~/.nastech).

on:
  workflow_call:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install 100ways + pytest
        run: |
          pip install -e .
          # Install dev extras so pytest has its plugin deps (pygments,
          # anyio, iniconfig, etc.).  Bare "pytest" install was missing
          # transitive deps on some CI runners.
          pip install ".[dev]"

      - name: Run test suite
        run: |
          python3 -m pytest tests/ -q
