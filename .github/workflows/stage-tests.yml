name: stage-tests

# Stage 2: the full pytest suite (stdlib + pytest only, no network, no
# writes to ~/.nastech).

on:
  workflow_call:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.2.2

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install 100ways + pytest
        run: |
          pip install -e .
          pip install "pytest>=7,<9"

      - name: Run test suite
        run: |
          python3 -m pytest tests/ -q
