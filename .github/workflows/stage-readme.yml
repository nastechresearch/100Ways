name: stage-readme

# Stage 7: regenerate README.md from the registries (ways, achievements,
# owned-assets, CLI verbs and Telegram commands) and fail if the committed
# copy is stale.  This guarantees the way total, the trophy count and the
# command inventory in the README never drift from the code that owns them.
#
# A second gate then scores the README that ships against the live command
# surface: a verb or command the engine answers to but the README never
# describes is a red, so "the README documents the project" stays a measured
# claim rather than a hoped-for one.
#
# The owned-assets registry and achievements state are committed in this
# repository.  README generation therefore uses the 100Ways checkout itself,
# making the published asset count reproducible from the engine that owns it.

on:
  workflow_call:

jobs:
  readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.2.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install 100ways
        run: |
          pip install -e .

      - name: Regenerate README
        run: |
          100ways --repo "$GITHUB_WORKSPACE" readme --state-dir "$GITHUB_WORKSPACE"

      - name: Fail if README is stale
        run: |
          git diff --exit-code -- README.md
          echo "README.md is up to date."

      - name: Fail if README under-documents the command surface
        run: |
          100ways --repo "$GITHUB_WORKSPACE" readme --check-coverage --min 0.7
