name: stage-readme

# Stage 7: regenerate README.md from the registries (ways, achievements,
# owned-assets) and fail if the committed copy is stale.  This guarantees
# the "200 ways" / trophy counts never drift from the code that owns them.
#
# The owned-assets registry and achievements state are committed in this
# repository.  README generation therefore uses the 100Ways checkout itself,
# making the published asset count reproducible from the engine that owns it.

on:
  workflow_call:

jobs:
  readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.2.2

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install 100ways
        run: |
          pip install -e .

      - name: Regenerate README
        run: |
          100ways --repo "$GITHUB_WORKSPACE" readme --state-dir "$GITHUB_WORKSPACE"

      - name: Fail if README is stale
        run: |
          git diff --exit-code -- README.md
          echo "README.md is up to date."
