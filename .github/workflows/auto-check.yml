name: auto-check

# Auto-check: on a schedule, compare the Nastech fork against the live
# Hermes upstream using git (blobless clone + fetch, exact rev-list counts).
# When the upstream is ahead of the fork, summarize what's new and kick off
# the full pipeline (CI) so the update gets branded, gated and pushed as a
# PR to nastech-agent main.
#
#   schedule --(behind > 0?)--> summary issue + dispatch CI -> update-pr
#
# The summary is written to the workflow run summary AND mirrored to a
# GitHub issue ("Upstream update detected") so every detected sync is
# reviewable even if the pipeline run is still queued.

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.2.2

      - name: Blobless clone the fork + fetch upstream Hermes
        run: |
          git clone --filter=blob:none --no-checkout \
            https://github.com/nastechresearch/nastech-agent.git fork
          git -C fork remote add upstream \
            https://github.com/NousResearch/hermes-agent.git
          git -C fork fetch --filter=blob:none --no-tags upstream main

      - name: Compute upstream delta
        id: diff
        run: |
          cd fork
          OURS=$(git rev-parse HEAD)
          UPSTREAM=$(git rev-parse upstream/main)
          BEHIND=$(git rev-list --count "$OURS..$UPSTREAM")
          AHEAD=$(git rev-list --count "$UPSTREAM..$OURS")
          echo "fork main      : ${OURS:0:12}"
          echo "live upstream  : ${UPSTREAM:0:12}"
          echo "fork is $BEHIND behind upstream, $AHEAD ahead"
          echo "ours=$OURS" >> "$GITHUB_OUTPUT"
          echo "upstream=$UPSTREAM" >> "$GITHUB_OUTPUT"
          echo "behind=$BEHIND" >> "$GITHUB_OUTPUT"
          echo "ahead=$AHEAD" >> "$GITHUB_OUTPUT"
          if [ "$BEHIND" -gt 0 ]; then
            echo "synced=false" >> "$GITHUB_OUTPUT"
          else
            echo "synced=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Summarize what's new
        if: steps.diff.outputs.synced == 'false'
        run: |
          cd fork
          OURS="${{ steps.diff.outputs.ours }}"
          UPSTREAM="${{ steps.diff.outputs.upstream }}"
          {
            echo "## Upstream update detected"
            echo
            echo "Nastech fork \`${OURS:0:12}\` is **${{ steps.diff.outputs.behind }} commits**
            behind live Hermes \`${UPSTREAM:0:12}\` (fork is
            ${{ steps.diff.outputs.ahead }} ahead)."
            echo
            echo "### New commits (first 60)"
            echo
            echo '```'
            git log --oneline --no-decorate "$OURS..$UPSTREAM" | head -60
            echo '```'
            echo
            echo "### Diffstat (last 40 files)"
            echo
            echo '```'
            git diff --stat "$OURS...$UPSTREAM" | tail -40
            echo '```'
          } > "$GITHUB_STEP_SUMMARY"
          echo "summary written to \$GITHUB_STEP_SUMMARY"

      - name: Mirror summary to an issue
        if: steps.diff.outputs.synced == 'false'
        env:
          GH_TOKEN: ${{ secrets.NAS_TECH_AGENT_TOKEN }}
        run: |
          cd fork
          OURS="${{ steps.diff.outputs.ours }}"
          UPSTREAM="${{ steps.diff.outputs.upstream }}"
          BODY=$(git log --oneline --no-decorate "$OURS..$UPSTREAM" | head -60)
          TITLE="Upstream update detected (${{ steps.diff.outputs.behind }} new commits)"
          URL=$(gh issue list --repo nastechresearch/100Ways \
            --search "Upstream update detected in:title state:open" \
            --json number --jq '.[0].number' 2>/dev/null) || true
          if [ -n "$URL" ]; then
            gh issue edit "$URL" --repo nastechresearch/100Ways \
              --title "$TITLE" --body "$BODY"
            echo "updated detection issue #$URL"
          else
            gh issue create --repo nastechresearch/100Ways \
              --title "$TITLE" --body "$BODY"
          fi

      - name: Trigger the full pipeline
        if: steps.diff.outputs.synced == 'false'
        env:
          GH_TOKEN: ${{ secrets.NAS_TECH_AGENT_TOKEN }}
        run: |
          gh workflow run ci.yml --repo nastechresearch/100Ways
          echo "dispatched CI pipeline"
