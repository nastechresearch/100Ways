name: test-secret-called
on:
  workflow_call:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        env:
          GH_TOKEN: ${{ secrets.NAS_TECH_AGENT_TOKEN }}
        run: |
          if [ -n "$GH_TOKEN" ]; then
            echo "TOKEN_PRESENT length=${#GH_TOKEN}"
          else
            echo "TOKEN_MISSING"
          fi
