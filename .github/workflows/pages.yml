name: 100Ways Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.2.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install 100Ways
        run: pip install -e .

      - name: Fetch public source refs directly
        id: fetch_sources
        run: |
          set -euo pipefail
          {
            scripts/fetch_public_repo.sh https://github.com/nastechresearch/nastech-agent.git nastech-agent
            scripts/fetch_public_repo.sh https://github.com/nastechresearch/nastech-agent.git nastech-candidate 100WAYS || true
            scripts/fetch_public_repo.sh https://github.com/NousResearch/hermes-agent.git upstream-agent
          } 2>&1 | tee "$RUNNER_TEMP/source-fetch.log"

      - name: Analyze source-fetch failure
        if: ${{ always() && steps.fetch_sources.outcome == 'failure' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 scripts/analyze_actions_failure.py \
            --log "$RUNNER_TEMP/source-fetch.log" \
            --step "Fetch public source refs directly" \
            --output "$RUNNER_TEMP/source-fetch-analysis.json" | tee -a "$GITHUB_STEP_SUMMARY"
          echo 'The source fetch failed; publication remains fail-closed.' >> "$GITHUB_STEP_SUMMARY"

      - name: Build public status payload
        run: |
          set -euo pipefail
          CANDIDATE_ARGS=()
          if test -f nastech-candidate/manifest.json; then
            CANDIDATE_ARGS=(--candidate-repo nastech-candidate)
          fi
          python3 -m hundredways.commit_stream \
            --upstream-repo upstream-agent \
            --nastech-repo nastech-agent \
            "${CANDIDATE_ARGS[@]}" \
            --threshold 50 \
            --output decision.json
          python3 scripts/build_pages_status.py \
            --decision decision.json \
            --output site/status.json

      - name: Prepare Pages artifact
        run: |
          set -euo pipefail
          mkdir -p public
          cp -a site/. public/
          printf '%s\n' '100Ways public evidence only; no secrets or private logs.' > public/robots.txt

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public

  deploy:
    needs: build
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
