name: 100Ways Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
    - cron: "*/30 * * * *"

permissions:
  contents: read
  actions: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.cadence.outputs.run }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.2.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install 100Ways
        run: pip install -e .

      - name: Select durability cadence
        id: cadence
        env:
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          BURST_MODE: ${{ vars.DURABILITY_BURST_MODE }}
        run: |
          set -euo pipefail
          if [ "$EVENT_SCHEDULE" = "*/30 * * * *" ] && [ "${BURST_MODE:-false}" != "true" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "30-minute wake-up is idle until the 500-commit threshold is reached."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch public source refs directly
        if: steps.cadence.outputs.run == 'true'
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/nastechresearch/nastech-agent.git nastech-agent
          git clone --depth=1 --branch 100WAYS https://github.com/nastechresearch/nastech-agent.git nastech-candidate || true
          git clone https://github.com/NousResearch/hermes-agent.git upstream-agent

      - name: Build public status payload
        if: steps.cadence.outputs.run == 'true'
        run: |
          set -euo pipefail
          THRESHOLD=500
          if [ "${{ vars.DURABILITY_BURST_MODE }}" = "true" ]; then
            THRESHOLD=50
          fi
          CANDIDATE_ARGS=()
          if test -f nastech-candidate/manifest.json; then
            CANDIDATE_ARGS=(--candidate-repo nastech-candidate)
          fi
          python3 -m hundredways.commit_stream \
            --upstream-repo upstream-agent \
            --nastech-repo nastech-agent \
            "${CANDIDATE_ARGS[@]}" \
            --threshold "$THRESHOLD" \
            --output decision.json
          python3 scripts/build_pages_status.py \
            --decision decision.json \
            --output site/status.json
          if jq -e '.trigger_sync == true' decision.json >/dev/null; then
            gh variable set DURABILITY_BURST_MODE --repo "$GITHUB_REPOSITORY" --body true
            echo "500 commits reached; 30-minute / 50-commit burst mode enabled."
          fi

      - name: Prepare Pages artifact
        if: steps.cadence.outputs.run == 'true'
        run: |
          set -euo pipefail
          mkdir -p public
          cp -a site/. public/
          printf '%s\n' '100Ways public evidence only; no secrets or private logs.' > public/robots.txt

      - name: Upload Pages artifact
        if: steps.cadence.outputs.run == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public

  deploy:
    needs: build
    if: ${{ github.event_name != 'pull_request' && needs.build.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
