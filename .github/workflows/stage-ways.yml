name: stage-ways

# Stage 3: validate the ways registry — every category keeps at least its twenty ways,
# every way id is unique, and the registry count is >= 200.  No network.
#
# Twenty per category is a floor, not a shape: a capability that no decade of the
# catalogued taxonomy named is added as its own row rather than swapped into a row that
# already describes a different technique.  Shrinking a category below twenty is the
# failure this catches.

on:
  workflow_call:

jobs:
  ways:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.2.2

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Validate 200 ways
        run: |
          python3 - <<'EOF'
          from collections import Counter
          from hundredways.ways import build_registry
          r = build_registry()
          by_cat = Counter(w.category for w in r.all())
          ids = [w.way_id for w in r.all()]
          assert len(ids) == len(set(ids)), "duplicate way ids"
          assert r.count >= 200, f"registry count {r.count} < 200"
          for cat, n in sorted(by_cat.items()):
              print(f"  {cat}: {n}")
              assert n >= 20, f"{cat} has {n} ways, expected at least 20"
          print(f"ways: {r.count} unique ids OK")
          EOF
