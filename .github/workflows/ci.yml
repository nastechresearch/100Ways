name: CI

# Orchestrator.  Runs the 100Ways validation in STAGES:
#
#   lint  -> tests  -> ways  -> rules  -> pipeline  -> forkcheck  -> readme  -> upload  -> all-checks-pass  -> #344 Push PR to NasTech
#
# On a schedule, the commit stream runs first.  It compares the upstream
# history with the merged NasTech baseline and enables the full candidate
# chain only at the configured commit threshold. Pull requests validate 100Ways
# tooling but never mint an upstream candidate; manual runs retain full review.
#
# ``pipeline`` brands the upstream tree and runs the 18-stage update pipeline
# (including the fork-consistency diff against the real nastech-agent fork).
# ``forkcheck`` then installs the branded zip, boots `nastech`, and runs the
# fork's own test suite.  Publication is deliberately deferred until every
# remaining repository verification has completed; #344 is the final action.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_full_validation:
        description: Run the complete upstream candidate pipeline for manual review
        required: false
        type: boolean
        default: false
      publish_candidate_pr:
        description: Permit #344 to create or update the NasTech review PR after every gate passes
        required: false
        type: boolean
        default: false
      acknowledge_inherited_case_collisions:
        description: Acknowledge inherited source path collisions for a review-only NasTech PR
        required: false
        type: boolean
        default: false
  # 100Ways is event-driven only. No scheduled runs — the operator
  # triggers a sync via workflow_dispatch when they want one. This
  # avoids background CI burn on a project with 1 operator and 0
  # production users, and keeps the 19-stage pipeline from being
  # triggered by transient upstream activity.

permissions:
  contents: read

jobs:
  commit-stream:
    name: Commit stream monitor
    uses: ./.github/workflows/stage-commit-stream.yml
    with:
      threshold: ${{ inputs.threshold_override || 100 }}
      notify: ${{ github.event_name == 'workflow_dispatch' }}
    secrets:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}

  lint:
    needs: commit-stream
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || needs.commit-stream.outputs.trigger_sync == 'true' }}
    uses: ./.github/workflows/stage-lint.yml

  tests:
    needs: lint
    uses: ./.github/workflows/stage-tests.yml

  ways:
    needs: tests
    uses: ./.github/workflows/stage-ways.yml

  rules:
    needs: ways
    uses: ./.github/workflows/stage-rules.yml

  pipeline:
    needs: rules
    # Event-driven only: pipeline runs on workflow_dispatch with
    # run_full_validation=true.  PRs against main validate the
    # engine but never build a candidate.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_full_validation }}
    uses: ./.github/workflows/stage-pipeline.yml
    with:
      bootstrap: ${{ inputs.bootstrap || false }}
    secrets:
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}

  forkcheck:
    needs: pipeline
    uses: ./.github/workflows/stage-forkcheck.yml
    with:
      slice_count: 4

  readme:
    needs: forkcheck
    uses: ./.github/workflows/stage-readme.yml

  upload:
    needs: readme
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nastech-agent-update
          path: artifact
      - name: Show artifact
        run: |
          ls -la artifact
          unzip -l artifact/nastech-agent-update.zip | head -20

  all-checks-pass:
    needs: upload
    runs-on: ubuntu-latest
    steps:
      - run: 'echo "All 100Ways verification stages passed; #344 may now publish the candidate PR."'

  update-pr:
    name: "#344 — Push PR to NasTech"
    needs: [pipeline, forkcheck, all-checks-pass]
    # Event-driven: the operator must request publication explicitly via
    # workflow_dispatch with publish_candidate_pr=true.  Inherited
    # collisions still require an explicit acknowledgement.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_candidate_pr && (needs.pipeline.outputs.review_required != 'true' || inputs.acknowledge_inherited_case_collisions) }}
    permissions:
      contents: read
    uses: ./.github/workflows/stage-update-pr.yml
    with:
      upstream_sha: ${{ needs.pipeline.outputs.upstream_sha }}
      gate: ${{ needs.pipeline.outputs.gate }}
      inherited_collision_acknowledged: ${{ inputs.acknowledge_inherited_case_collisions }}
    secrets:
      NAS_TECH_AGENT_TOKEN: ${{ secrets.NAS_TECH_AGENT_TOKEN }}
