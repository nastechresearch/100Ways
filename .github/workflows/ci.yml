name: CI

# Orchestrator.  Runs the 100Ways validation in STAGES:
#
#   lint  -> tests  -> ways  -> rules  -> pipeline  -> forkcheck  -> readme  -> upload  -> all-checks-pass  -> #344 Push PR to NasTech
#
# Each job ``needs`` the previous, so a failure stops the chain early and
# the whole chain is re-triggered on every push / PR / schedule.  The
# release workflow (release-update.yml) reuses the same stage workflows and
# adds the GitHub release step on top.
#
# ``pipeline`` brands the upstream tree and runs the 18-stage update pipeline
# (including the fork-consistency diff against the real nastech-agent fork).
# ``forkcheck`` then installs the branded zip, boots `nastech`, and runs the
# fork's own test suite.  Publication is deliberately deferred until every
# remaining repository verification has completed; #344 is the final action.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1" # weekly Monday 04:00 UTC

permissions:
  contents: read

jobs:
  lint:
    uses: ./.github/workflows/stage-lint.yml

  tests:
    needs: lint
    uses: ./.github/workflows/stage-tests.yml

  ways:
    needs: tests
    uses: ./.github/workflows/stage-ways.yml

  rules:
    needs: ways
    uses: ./.github/workflows/stage-rules.yml

  pipeline:
    needs: rules
    uses: ./.github/workflows/stage-pipeline.yml

  forkcheck:
    needs: pipeline
    uses: ./.github/workflows/stage-forkcheck.yml
    with:
      slice_count: 4

  readme:
    needs: forkcheck
    uses: ./.github/workflows/stage-readme.yml

  upload:
    needs: readme
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nastech-agent-update
          path: artifact
      - name: Show artifact
        run: |
          ls -la artifact
          unzip -l artifact/nastech-agent-update.zip | head -20

  all-checks-pass:
    needs: upload
    runs-on: ubuntu-latest
    steps:
      - run: 'echo "All 100Ways verification stages passed; #344 may now publish the candidate PR."'

  update-pr:
    name: "#344 — Push PR to NasTech"
    needs: [pipeline, forkcheck, all-checks-pass]
    permissions:
      contents: read
    uses: ./.github/workflows/stage-update-pr.yml
    with:
      upstream_sha: ${{ needs.pipeline.outputs.upstream_sha }}
      gate: ${{ needs.pipeline.outputs.gate }}
    secrets: inherit
