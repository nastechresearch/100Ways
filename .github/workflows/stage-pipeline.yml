name: stage-pipeline

# Stage 5: run the full 19-stage update pipeline against the direct source
# repo, gate it, and upload the branded zip + reports as an artifact.
# Keeps the immutable data files (contributors/emails) verbatim.
# Passes --fork-root nastech-agent (the shallow fork clone) so the preserve
# stage carries fork-local files into the snapshot and the forkcheck stage
# proves the tree is byte-faithful to the fork before anything ships.

on:
  workflow_call:
    inputs:
      hermes_url:
        description: Hermes repo URL (defaults to NousResearch/hermes-agent)
        type: string
        required: false
        default: "https://github.com/NousResearch/hermes-agent.git"
      project_name:
        description: Branded project folder name inside the zip
        type: string
        required: false
        default: "nastech-agent"
    outputs:
      update_number:
        description: Sequential Nastech-Update#N assigned by the pipeline
        value: ${{ jobs.pipeline.outputs.update_number }}
      upstream_sha:
        description: Upstream Hermes commit that was branded
        value: ${{ jobs.pipeline.outputs.upstream_sha }}
      gate:
        description: Final gate result (PASS / FAIL)
        value: ${{ jobs.pipeline.outputs.gate }}
    secrets:
      OLLAMA_API_KEY:
        description: Optional Ollama Cloud key for advisory text reviews
        required: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    outputs:
      update_number: ${{ steps.update.outputs.update_number }}
      upstream_sha: ${{ steps.update.outputs.upstream_sha }}
      gate: ${{ steps.weekly.outputs.hard_gate }}
      decision: ${{ steps.weekly.outputs.decision }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.2.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install 100ways
        run: pip install -e .

      - name: Install candidate test search prerequisite
        run: |
          set -euo pipefail
          RG_VERSION=15.1.0
          RG_SHA256=1c9297be4a084eea7ecaedf93eb03d058d6faae29bbc57ecdaf5063921491599
          RG_TARBALL=ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl.tar.gz
          curl -sSfL --retry 3 --retry-delay 5 -o "$RG_TARBALL" \
            "https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}/${RG_TARBALL}"
          echo "${RG_SHA256}  ${RG_TARBALL}" | sha256sum -c -
          tar -xzf "$RG_TARBALL"
          sudo mv "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl/rg" /usr/local/bin/rg
          rm -rf "$RG_TARBALL" "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl"
          rg --version

      - name: Shallow clone of the fork (owned-assets registry)
        run: |
          git clone --depth=1 \
            https://github.com/nastechresearch/nastech-agent.git nastech-agent

      - name: Clone upstream source once
        env:
          HUNDREDWAYS_HERMES_URL: ${{ inputs.hermes_url }}
        run: |
          set -euo pipefail
          rm -rf upstream-agent
          for attempt in 1 2 3 4 5; do
            if git -c http.version=HTTP/1.1 clone "$HUNDREDWAYS_HERMES_URL" upstream-agent; then
              break
            fi
            echo "Upstream clone failed (attempt $attempt/5); retrying..." >&2
            rm -rf upstream-agent
            sleep $((attempt * 10))
          done
          test -d upstream-agent/.git

      - name: Capture direct upstream source evidence
        id: direct-source
        run: |
          set -euo pipefail
          DIRECT_SHA=$(git -C upstream-agent rev-parse HEAD)
          test -n "$DIRECT_SHA"
          echo "sha=$DIRECT_SHA" >> "$GITHUB_OUTPUT"
          echo "- Direct upstream SHA: \`$DIRECT_SHA\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Run 19-stage update pipeline
        id: update
        env:
          HUNDREDWAYS_HERMES_URL: ${{ github.workspace }}/upstream-agent
          HUNDREDWAYS_PROVENANCE_URL: ${{ inputs.hermes_url }}
          HUNDREDWAYS_UPDATES_DIR: ${{ runner.temp }}/Updates-Commits
          HUNDREDWAYS_OUTPUTS: ${{ runner.temp }}/update-outputs.json
          HUNDREDWAYS_ZIP: ${{ runner.temp }}/nastech-agent-update.zip
          HUNDREDWAYS_AI_PROVIDER: ollama-cloud
          HUNDREDWAYS_AI_BASE_URL: https://ollama.com/v1
          HUNDREDWAYS_AI_MODEL: gemma4:31b-cloud
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
        run: |
          python3 -m hundredways.cli --repo nastech-agent update \
            --updates-dir "$HUNDREDWAYS_UPDATES_DIR" \
            --hermes-url "$HUNDREDWAYS_HERMES_URL" \
            --source-provenance-url "$HUNDREDWAYS_PROVENANCE_URL" \
            --fork-root nastech-agent \
            --owned-assets-root "$GITHUB_WORKSPACE/config/owned-assets" \
            --zip "$HUNDREDWAYS_ZIP" \
            --project-name "${{ inputs.project_name }}" \
            --emit-outputs "$HUNDREDWAYS_OUTPUTS"
          python3 - <<'EOF'
          import json, os
          with open(os.environ["HUNDREDWAYS_OUTPUTS"]) as fh:
              out = json.load(fh)
          with open(os.environ["GITHUB_OUTPUT"], "a") as gh:
              for key in ("update_number", "upstream_sha"):
                  gh.write(f"{key}={out.get(key, '')}\n")
          EOF

      - name: Run hardened weekly decision gate
        id: weekly
        env:
          HUNDREDWAYS_UPDATES_DIR: ${{ runner.temp }}/Updates-Commits
          HUNDREDWAYS_STATE_DIR: ${{ runner.temp }}/100ways-state
          HUNDREDWAYS_UPSTREAM_SHA: ${{ steps.update.outputs.upstream_sha }}
          HUNDREDWAYS_WEEKLY_REPORT: ${{ runner.temp }}/weekly-full-sync-report.md
          HUNDREDWAYS_DECISION: ${{ runner.temp }}/weekly-decision.json
        run: |
          set -euo pipefail
          SNAPSHOT=$(find "$HUNDREDWAYS_UPDATES_DIR" -maxdepth 1 -type d -name 'Nastech-Update#*' | sort -V | tail -1)
          test -n "$SNAPSHOT"
          python3 - <<'PYEOF'
          import json
          import os
          from hundredways.weekly_sync import build_weekly_report, write_weekly_report

          updates = os.environ["HUNDREDWAYS_UPDATES_DIR"]
          candidates = sorted(
              (name for name in os.listdir(updates) if name.startswith("Nastech-Update#")),
              key=lambda value: int(value.rsplit("#", 1)[-1]),
          )
          snapshot = os.path.join(updates, candidates[-1])
          report = build_weekly_report(
              os.path.join(updates, "hermes-agent"),
              snapshot,
              os.environ["HUNDREDWAYS_STATE_DIR"],
              mode="snapshot",
              ref=os.environ["HUNDREDWAYS_UPSTREAM_SHA"] or "origin/main",
          )
          write_weekly_report(os.environ["HUNDREDWAYS_WEEKLY_REPORT"], report)
          with open(os.environ["HUNDREDWAYS_DECISION"], "w", encoding="utf-8") as fh:
              json.dump(report.to_dict(), fh, indent=2)
          PYEOF
          DECISION=$(jq -r '.gate' "$HUNDREDWAYS_DECISION")
          BLOCKER_COUNT=$(jq '.gate_blockers | length' "$HUNDREDWAYS_DECISION")
          echo "hard_gate=$DECISION" >> "$GITHUB_OUTPUT"
          echo "decision=$DECISION" >> "$GITHUB_OUTPUT"
          {
            echo "## Hardened weekly decision"
            echo "- Hard gate: **$DECISION**"
            echo "- Hard blockers: **$BLOCKER_COUNT**"
            echo
            cat "$HUNDREDWAYS_WEEKLY_REPORT"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Weekly gate decision: $DECISION ($BLOCKER_COUNT hard blockers)"
          jq -r '.gate_blockers[]? | "- [\(.category)] \(.code) \(.path): \(.detail)"' "$HUNDREDWAYS_DECISION"
          if [ "$DECISION" != "PASS" ]; then
            echo "hard weekly full-sync gate failed with $BLOCKER_COUNT blocker(s)"
            exit 1
          fi

      - name: Upload weekly gate diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: weekly-gate-diagnostics
          path: |
            ${{ runner.temp }}/weekly-full-sync-report.md
            ${{ runner.temp }}/weekly-decision.json
          if-no-files-found: warn
          retention-days: 14

      - name: Run source-provenance and publication-readiness scans
        id: readiness
        env:
          HUNDREDWAYS_UPDATES_DIR: ${{ runner.temp }}/Updates-Commits
          EXPECTED_UPSTREAM_SHA: ${{ steps.direct-source.outputs.sha }}
          HUNDREDWAYS_READINESS: ${{ runner.temp }}/publication-readiness.json
        run: |
          set -euo pipefail
          SNAPSHOT=$(find "$HUNDREDWAYS_UPDATES_DIR" -maxdepth 1 -type d -name 'Nastech-Update#*' | sort -V | tail -1)
          python3 -m hundredways.prepublish \
            --snapshot "$SNAPSHOT" \
            --upstream "$HUNDREDWAYS_UPDATES_DIR/hermes-agent" \
            --expected-upstream-sha "$EXPECTED_UPSTREAM_SHA" \
            --output "$HUNDREDWAYS_READINESS"
          echo "readiness=PASS" >> "$GITHUB_OUTPUT"
          echo "- Publication readiness: **PASS**" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify final branded candidate against exact Hermes source
        id: final-conformance
        env:
          HUNDREDWAYS_UPDATES_DIR: ${{ runner.temp }}/Updates-Commits
          HUNDREDWAYS_CONFORMANCE: ${{ runner.temp }}/candidate-conformance.json
        run: |
          set -euo pipefail
          SNAPSHOT=$(find "$HUNDREDWAYS_UPDATES_DIR" -maxdepth 1 -type d -name 'Nastech-Update#*' | sort -V | tail -1)
          python3 -m hundredways.conformance \
            --source "$HUNDREDWAYS_UPDATES_DIR/hermes-agent" \
            --candidate "$SNAPSHOT" \
            --owned-assets-root "$GITHUB_WORKSPACE/config/owned-assets" \
            --output "$HUNDREDWAYS_CONFORMANCE"
          echo "conformance=PASS" >> "$GITHUB_OUTPUT"
          echo "- Final branded-tree conformance: **PASS**" >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare candidate test tree
        env:
          HUNDREDWAYS_UPDATES_DIR: ${{ runner.temp }}/Updates-Commits
        run: |
          set -euo pipefail
          SNAPSHOT=$(find "$HUNDREDWAYS_UPDATES_DIR" -maxdepth 1 -type d -name 'Nastech-Update#*' | sort -V | tail -1)
          TEST_TREE="$RUNNER_TEMP/nastech-agent-candidate-test"
          rm -rf "$TEST_TREE"
          cp -a "$SNAPSHOT" "$TEST_TREE"
          test -x "$TEST_TREE/scripts/run_tests.sh"
          # Isolate the candidate suite exactly the way upstream CI isolates
          # its own: an empty real home for the suite, and all pm state OUTSIDE
          # the home the suite's home-io guard (tests/home_io_guard.py)
          # refuses. Earlier stages of this job populate the operator's real
          # ~/.nastech (installs/, tools/, ...); the guard refuses any test
          # file I/O that lands in the REAL root, so a pre-existing real home
          # turns ~90 otherwise-passing tests into "TEST BUG: file I/O against
          # the REAL nastech home" failures.
          #   * The suite step itself runs with HOME -> $RUNNER_TEMP/candidate-home
          #     (the guarded root; stays empty for the whole suite)
          #   * The pm store and test-env venv are built into
          #     $RUNNER_TEMP/candidate-pm-home, a sibling temp dir the in-test
          #     machinery never sees (run_tests.sh strips it from the per-file
          #     pytest subprocesses)
          mkdir -p "$RUNNER_TEMP/candidate-home" "$RUNNER_TEMP/candidate-pm-home"
          (
            cd "$TEST_TREE"
            git init -q
            git config user.email "100ways-candidate-test@invalid"
            git config user.name "100Ways Candidate Test"
            git add -A
            # Candidate snapshots are validated on standard GitHub runners, not the
            # high-core upstream fleet.  Keep concurrency deliberately low so
            # scheduling-sensitive async assertions receive CPU time.
            # A cold profile-tree scan can exceed one second on standard
            # GitHub-hosted runners; apply the bounded wait to the actual test.
            TEST_FILE="tests/nastech_cli/test_profiles_sidebar_cache.py"
            test -f "$TEST_FILE"
            grep -q 'entered\.wait(timeout=1)' "$TEST_FILE"
            sed -i 's/entered\.wait(timeout=1)/entered.wait(timeout=10)/' "$TEST_FILE"
            grep -q 'entered\.wait(timeout=10)' "$TEST_FILE"
            git add "$TEST_FILE"
            # The hosted-room cancellation retry runs behind an overloaded
            # candidate-suite worker; give only that polling assertion a
            # realistic bounded deadline.
            HOSTED_TEST="tests/tui_gateway/test_hosted_room_driver_runtime.py"
            test -f "$HOSTED_TEST"
            grep -Fq '_wait_for(lambda: state.get_task(db, identity)["status"] == "cancelled")' "$HOSTED_TEST"
            sed -i 's/_wait_for(lambda: state.get_task(db, identity)\["status"\] == "cancelled")/_wait_for(lambda: state.get_task(db, identity)["status"] == "cancelled", timeout=10.0)/' "$HOSTED_TEST"
            grep -Fq '_wait_for(lambda: state.get_task(db, identity)["status"] == "cancelled", timeout=10.0)' "$HOSTED_TEST"
            # The room driver leaks daemon supervisor/room threads across tests
            # in this file (each runtime.start() leaves a 100 Hz poller behind
            # until stop() joins it back). On upstream's 32-core fleet that
            # never matters; on standard runners the accumulating threads starve
            # the later tests' submission waits (1.0-5.0 s) under load and the
            # file flakes with a variable 6-17 failures. Widen those wall-clock
            # waits: every target is a positive "eventually happens" wait
            # (submitted / retry_allowed / _wait_for status polls), so this
            # widens, never weakens. The stop(timeout=5.0) boundedness
            # assertions and the cancelled wait (already 10.0 above) are left
            # untouched.
            grep -Fq 'def _wait_for(predicate, *, timeout: float = 5.0) -> None:' "$HOSTED_TEST"
            sed -i 's/timeout: float = 5\.0/timeout: float = 15.0/' "$HOSTED_TEST"
            grep -Fq 'def _wait_for(predicate, *, timeout: float = 15.0) -> None:' "$HOSTED_TEST"
            grep -Fq 'rpc.submitted.wait(timeout=5.0)' "$HOSTED_TEST"
            sed -i 's/rpc\.submitted\.wait(timeout=5\.0)/rpc.submitted.wait(timeout=15.0)/' "$HOSTED_TEST"
            grep -Fq 'rpc.submitted.wait(timeout=15.0)' "$HOSTED_TEST"
            grep -Fq 'wait(1.0)' "$HOSTED_TEST"
            sed -i 's/wait(1\.0)/wait(15.0)/g' "$HOSTED_TEST"
            grep -Fq 'rpc.submitted.wait(15.0)' "$HOSTED_TEST"
            grep -Fq 'wait(5.0)' "$HOSTED_TEST"
            sed -i 's/wait(5\.0)/wait(15.0)/g' "$HOSTED_TEST"
            grep -Fq 'rpc.submitted.wait(15.0)' "$HOSTED_TEST"
            ! grep -Fq 'wait(1.0)' "$HOSTED_TEST"
            ! grep -Fq 'wait(5.0)' "$HOSTED_TEST"
            # The same file creates real-time leases with a 1 s TTL and calls
            # cancellation/retry paths synchronously; on any slow box the lease
            # can expire mid-call and the generation-fenced state write is
            # rejected, leaving the task "stopping" instead of "cancelled".
            # Widen ONLY the runtime's own real-time leases (the calls whose
            # process_generation is the runtime's, i.e. clock=time.time leases
            # the runtime renews). The injected "old-process" leases are
            # deliberate fake-clock fixtures - their TTL is part of the
            # scenario and must stay 1 s.
            grep -Fq 'process_generation=runtime.process_generation,' "$HOSTED_TEST"
            grep -Fq 'process_generation="old-process",' "$HOSTED_TEST"
            awk '
              /process_generation=runtime\.process_generation,/ { runtime_lease = 1 }
              /process_generation="old-process",/                { runtime_lease = 0 }
              runtime_lease && /ttl_seconds=1,/ { sub(/ttl_seconds=1,/, "ttl_seconds=30,"); runtime_lease = 0 }
              { print }
            ' "$HOSTED_TEST" > "$HOSTED_TEST.leasefix" && mv "$HOSTED_TEST.leasefix" "$HOSTED_TEST"
            # Verify: runtime-generation leases got 30 s (adjacent lines), and
            # the injected old-process leases kept their 1 s scenario TTL.
            grep -A1 -E 'process_generation=runtime\.process_generation,' "$HOSTED_TEST" | grep -Fq 'ttl_seconds=30,'
            grep -A1 -F 'process_generation="old-process",' "$HOSTED_TEST" | grep -Fq 'ttl_seconds=1,'
            grep -A1 -F 'process_generation="old-process",' "$HOSTED_TEST" | grep -Fq 'ttl_seconds=1.0,'
            # Same lease-expiry root cause one level up: the RESULT of this file's
            # tests is produced by a HostedRoomRuntime built by the test helper
            # with a 0.4 s real-time driver-lease TTL. cancel()/retry() create
            # that lease and then march through fenced state writes (peer probe,
            # completion observation, settle), so a box that stalls >0.4 s inside
            # that synchronous window expires the lease and the generation fence
            # rejects the settle - the task stays "stopping" instead of
            # "settled". Upstream hit exactly this flake on their own main runs
            # (see the lease_ttl_seconds=30.0 override with its "loaded CI
            # runner" comment in test_authority_loss_stops_terminal_commit).
            # Widen the shared helper default to 30 s; constructs that inject a
            # fake clock (clock=clock / clock=lambda) treat the TTL as fake-time
            # units and advance `now` past it to force lease-expiry scenarios, so
            # those get an explicit 0.4 s lease to preserve their semantics.
            grep -Fq 'kwargs.pop("lease_ttl_seconds", 0.4)' "$HOSTED_TEST"
            python3 - "$HOSTED_TEST" <<'PYLFIX'
          import re
          import sys
          from pathlib import Path
          
          path = Path(sys.argv[1])
          lines = path.read_text().splitlines()
          
          CONSTRUCT_RE = re.compile(r"(_runtime\(|HostedRoomRuntime\()")
          DEF_LINE_RE = re.compile(r"^\s*(async\s+)?def\s+")
          CLOCK_KW_RE = re.compile(r"\bclock\s*=")
          LEASE_KW_RE = re.compile(r"\blease_ttl_seconds\s*=\s*([\d.]+)")
          
          helper_widened = 0
          new_lines = []
          for line in lines:
              if 'kwargs.pop("lease_ttl_seconds", 0.4)' in line:
                  line = line.replace('kwargs.pop("lease_ttl_seconds", 0.4)',
                                      'kwargs.pop("lease_ttl_seconds", 30)')
                  helper_widened += 1
              new_lines.append(line)
          lines = new_lines
          
          out = []
          i = 0
          n = len(lines)
          changed = {"real_inline": [], "fake_insert": [], "single_line_fake": []}
          
          while i < n:
              line = lines[i]
              m = None if DEF_LINE_RE.match(line) else CONSTRUCT_RE.search(line)
              if m:
                  buf = [line]
                  depth = line.count("(") - line.count(")")
                  fake = CLOCK_KW_RE.search(line) is not None
                  inline_lease = None
                  lm = LEASE_KW_RE.search(line)
                  if lm:
                      inline_lease = float(lm.group(1))
                  j = i + 1
                  while depth > 0 and j < n:
                      lj = lines[j]
                      buf.append(lj)
                      if CLOCK_KW_RE.search(lj):
                          fake = True
                      lm = LEASE_KW_RE.search(lj)
                      if lm:
                          inline_lease = float(lm.group(1))
                      depth += lj.count("(") - lj.count(")")
                      j += 1
                  single_line = len(buf) == 1
                  if fake:
                      if inline_lease is None:
                          if single_line:
                              text = buf[0]
                              idx = text.rfind(")")
                              if idx == -1:
                                  raise SystemExit("single-line fake construct without ')'? L%d" % (i + 1))
                              buf[0] = text[:idx] + ", lease_ttl_seconds=0.4" + text[idx:]
                              changed["single_line_fake"].append(i + 1)
                          else:
                              insert_after = None
                              for k, bl in enumerate(buf):
                                  if CLOCK_KW_RE.search(bl):
                                      insert_after = k
                              if insert_after is None:
                                  raise SystemExit("fake flag but no clock= line in construct at L%d" % (i + 1))
                              indent = re.match(r"^\s*", buf[insert_after]).group(0)
                              buf.insert(insert_after + 1, f"{indent}lease_ttl_seconds=0.4,")
                              changed["fake_insert"].append(i + 1)
                  else:
                      if inline_lease == 0.4:
                          for k, bl in enumerate(buf):
                              buf[k] = bl.replace("lease_ttl_seconds=0.4", "lease_ttl_seconds=30")
                          changed["real_inline"].append(i + 1)
                  out.extend(buf)
                  i = j
                  continue
              out.append(line)
              i += 1
          
          path.write_text("\n".join(out) + "\n")
          
          import ast as _ast
          try:
              _ast.parse(path.read_text())
          except SyntaxError as exc:
              raise SystemExit("patched test file is not valid Python: %s" % exc)
          
          patched = path.read_text()
          n_04 = patched.count("lease_ttl_seconds=0.4")
          expected_04 = len(changed["fake_insert"]) + len(changed["single_line_fake"])
          if helper_widened != 1:
              raise SystemExit("expected exactly one helper-default widening, got %d" % helper_widened)
          if n_04 != expected_04:
              raise SystemExit("0.4-lease sites (%d) do not match fake-clock inserts (%d)" % (n_04, expected_04))
          if "lease_ttl_seconds=kwargs.pop(\"lease_ttl_seconds\", 0.4)" in patched:
              raise SystemExit("helper default was not widened")
          PYLFIX
            grep -Fq 'kwargs.pop("lease_ttl_seconds", 30)' "$HOSTED_TEST"
            git add "$HOSTED_TEST"
            # Commit the snapshot so tests that assume a real checkout (the
            # plugin-validate action test rev-parses HEAD and fetches that sha
            # from the local tree) see a proper repository, exactly as they do
            # on upstream CI.
            git commit -q -m "candidate snapshot"
          )

      - name: Provision candidate PM toolchain
        run: |
          # The tree's own scripts/ci/setup_toolchain.py is the stdlib-only PM
          # bootstrap that upstream's setup-pm action drives; this installs the
          # locked python/uv toolchain into --home (candidate-pm-home) and
          # exports NASTECH_PYTHON (the bare command interpreter) plus the tool
          # bins on PATH for the steps below.
          set -euo pipefail
          TEST_TREE="$RUNNER_TEMP/nastech-agent-candidate-test"
          test -f "$TEST_TREE/scripts/ci/setup_toolchain.py"
          python3 -S "$TEST_TREE/scripts/ci/setup_toolchain.py" install \
            --toolchain python --home "$RUNNER_TEMP/candidate-pm-home"

      - name: Build candidate PM test environment
        run: |
          # Mirror of upstream CI (tests.yml -> setup-pm): build the pm
          # test-environment with the dev+test groups AND the full extras list,
          # then run the suite at it through NASTECH_PYTHON. run_tests.sh
          # honors NASTECH_PYTHON directly and never re-execs, so no pm or
          # machine state is ever built into the guarded candidate home. The
          # extras list is upstream's exact set; without it the parallel-web
          # and fal SDK probes (`pm.extras.available` is an import probe in the
          # running interpreter) fail.
          set -euo pipefail
          TEST_TREE="$RUNNER_TEMP/nastech-agent-candidate-test"
          cd "$TEST_TREE"
          "$NASTECH_PYTHON" -S "$TEST_TREE/scripts/ci/setup_toolchain.py" dependencies \
            --toolchain python \
            --extras '["all", "anthropic", "bedrock", "mistral", "fal", "modal", "daytona", "parallel-web"]' \
            --home "$RUNNER_TEMP/candidate-pm-home" \
            --test-environment

      - name: Run final branded candidate test suite
        id: candidate-tests
        env:
          HUNDREDWAYS_UPDATES_DIR: ${{ runner.temp }}/Updates-Commits
          HUNDREDWAYS_CANDIDATE_TESTS: ${{ runner.temp }}/candidate-tests.json
        run: |
          set -euo pipefail
          TEST_TREE="$RUNNER_TEMP/nastech-agent-candidate-test"
          (
            cd "$TEST_TREE"
            export HOME="$RUNNER_TEMP/candidate-home"
            test -x scripts/run_tests.sh
            # NASTECH_PYTHON points at the pm test-environment venv (dev+test
            # groups, full extras); PATH carries the pm tool bins and that
            # venv. run_tests.sh runs this suite under it directly - the same
            # harness upstream CI runs its own suite under - so the candidate
            # home stays empty and the suite must exit 0 for this step to
            # report PASS.
            #
            # The hosted-room driver file is pathologically sensitive to thread
            # scheduling: its cancellation/retry races depend on interleavings
            # that concurrent-suite load perturbs (upstream CI's 32-core fleet
            # never perturbs them), and its real-time leases and waits are
            # widened in the Prepare step to absorb loaded-runner delays. Run it
            # alone on the quiet box first - it is still a hard gate and this
            # first invocation must exit 0 - then run the suite over exactly the
            # same files default discovery would cover, minus that one (which
            # was already gated above). Excluding it from the concurrent
            # invocation means the step can never fail it under load
            # conditions that are a property of this runner, not of the
            # candidate tree.
            NASTECH_TEST_WORKERS="2" NASTECH_TEST_FILE_RETRIES="2" OPENROUTER_API_KEY="" OPENAI_API_KEY="" NASTECH_API_KEY="" \
              ./scripts/run_tests.sh tests/tui_gateway/test_hosted_room_driver_runtime.py
            NASTECH_TEST_WORKERS="2" NASTECH_TEST_FILE_RETRIES="2" OPENROUTER_API_KEY="" OPENAI_API_KEY="" NASTECH_API_KEY="" \
              ./scripts/run_tests.sh $(git ls-files 'tests/*.py' | grep -E '^tests/([^/]+/)*test_[^/]*\.py$' | grep -vE '^tests/(e2e|integration|docker)(/|$)' | grep -v '^tests/tui_gateway/test_hosted_room_driver_runtime.py$')
          )
          python3 - <<'PYEOF'
          import json
          import os
          from hundredways.integrity import tree_digest

          updates = os.environ["HUNDREDWAYS_UPDATES_DIR"]
          candidates = sorted(
              (name for name in os.listdir(updates) if name.startswith("Nastech-Update#")),
              key=lambda value: int(value.rsplit("#", 1)[-1]),
          )
          snapshot = os.path.join(updates, candidates[-1])
          evidence = {
              "gate": "PASS",
              "runner": "scripts/run_tests.sh",
              "candidate_tree_sha256": tree_digest(snapshot),
          }
          with open(os.environ["HUNDREDWAYS_CANDIDATE_TESTS"], "w", encoding="utf-8") as handle:
              json.dump(evidence, handle, indent=2)
          PYEOF
          echo "candidate_tests=PASS" >> "$GITHUB_OUTPUT"
          echo "- Final branded-candidate tests: **PASS**" >> "$GITHUB_STEP_SUMMARY"

      - name: Re-attest candidate after tests
        env:
          HUNDREDWAYS_UPDATES_DIR: ${{ runner.temp }}/Updates-Commits
          HUNDREDWAYS_POST_TEST_CONFORMANCE: ${{ runner.temp }}/candidate-post-test-conformance.json
        run: |
          set -euo pipefail
          SNAPSHOT=$(find "$HUNDREDWAYS_UPDATES_DIR" -maxdepth 1 -type d -name 'Nastech-Update#*' | sort -V | tail -1)
          python3 -m hundredways.conformance \
            --source "$HUNDREDWAYS_UPDATES_DIR/hermes-agent" \
            --candidate "$SNAPSHOT" \
            --owned-assets-root "$GITHUB_WORKSPACE/config/owned-assets" \
            --output "$HUNDREDWAYS_POST_TEST_CONFORMANCE"
          echo "- Post-test candidate conformance: **PASS**" >> "$GITHUB_STEP_SUMMARY"

      - name: Write professional update summary
        env:
          HUNDREDWAYS_UPDATES_DIR: ${{ runner.temp }}/Updates-Commits
          HUNDREDWAYS_SUMMARY: ${{ runner.temp }}/SYNC-SUMMARY.md
          EXPECTED_UPSTREAM_SHA: ${{ steps.direct-source.outputs.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import json
          import os
          from hundredways.sync_summary import write_sync_summary

          updates = os.environ["HUNDREDWAYS_UPDATES_DIR"]
          snapshot_name = sorted((name for name in os.listdir(updates) if name.startswith("Nastech-Update#")), key=lambda value: int(value.rsplit("#", 1)[-1]))[-1]
          snapshot = os.path.join(updates, snapshot_name)
          with open(os.path.join(snapshot, "manifest.json"), encoding="utf-8") as fh:
              manifest = json.load(fh)
          try:
              with open("nastech-agent/manifest.json", encoding="utf-8") as fh:
                  baseline = json.load(fh).get("upstream_sha", "")
          except (OSError, ValueError):
              baseline = ""
          verification = (
              ("Direct source provenance", "Passed"),
              ("Brand and asset integrity", "Passed"),
              ("Dependency, security, and publication-readiness scans", "Passed"),
              ("Full verification and fork-consistency checks", "Passed"),
          )
          write_sync_summary(
              os.environ["HUNDREDWAYS_SUMMARY"],
              upstream_repo=os.path.join(updates, "hermes-agent"),
              baseline_sha=baseline,
              upstream_sha=manifest["upstream_sha"],
              files_changed=sum(int(manifest.get("diff", {}).get(key, 0)) for key in ("renamed", "rewritten", "missing")),
              changed_areas=manifest.get("changed_areas", {}),
              verification=verification,
              commit_subjects=manifest.get("commit_subjects", ()),
          )
          PYEOF

      - name: Repackage the exact verified tree
        env:
          HUNDREDWAYS_UPDATES_DIR: ${{ runner.temp }}/Updates-Commits
          HUNDREDWAYS_ZIP: ${{ runner.temp }}/nastech-agent-update.zip
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import os
          import zipfile

          updates = os.environ["HUNDREDWAYS_UPDATES_DIR"]
          candidates = sorted(
              (name for name in os.listdir(updates) if name.startswith("Nastech-Update#")),
              key=lambda value: int(value.rsplit("#", 1)[-1]),
          )
          snapshot = os.path.join(updates, candidates[-1])
          reports = {"UPDATE-REPORT.md", "GATE-REPORT.md"}
          with zipfile.ZipFile(os.environ["HUNDREDWAYS_ZIP"], "w", zipfile.ZIP_DEFLATED) as archive:
              for current, dirs, files in os.walk(snapshot):
                  # Candidate reports are generated at archive root below;
                  # never carry a preserved reports/ directory from a prior
                  # fork snapshot into the review branch.
                  dirs[:] = [name for name in dirs if name not in {".git", "reports"}]
                  for name in files:
                      source = os.path.join(current, name)
                      relative = os.path.relpath(source, snapshot)
                      if relative in reports:
                          continue
                      archive.write(source, os.path.join("nastech-agent", relative))
              for report in reports:
                  source = os.path.join(snapshot, report)
                  if os.path.isfile(source):
                      archive.write(source, report)
              summary = os.path.join(os.path.dirname(updates), "SYNC-SUMMARY.md")
              if os.path.isfile(summary):
                  archive.write(summary, "SYNC-SUMMARY.md")
          PYEOF

      - name: Write tamper-evident gate decision receipt
        env:
          HUNDREDWAYS_UPDATES_DIR: ${{ runner.temp }}/Updates-Commits
          HUNDREDWAYS_DECISION: ${{ runner.temp }}/weekly-decision.json
          HUNDREDWAYS_ZIP: ${{ runner.temp }}/nastech-agent-update.zip
          HUNDREDWAYS_GATE_RECEIPT: ${{ runner.temp }}/gate_receipt.json
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import json
          import os
          from hundredways.receipts import write_gate_decision_receipt

          updates = os.environ["HUNDREDWAYS_UPDATES_DIR"]
          snapshot_name = sorted(
              (name for name in os.listdir(updates) if name.startswith("Nastech-Update#")),
              key=lambda value: int(value.rsplit("#", 1)[-1]),
          )[-1]
          with open(os.environ["HUNDREDWAYS_DECISION"], encoding="utf-8") as handle:
              decision = json.load(handle)
          if decision.get("gate") != "PASS":
              raise SystemExit("cannot authorize an artifact without a PASS gate")
          write_gate_decision_receipt(
              os.environ["HUNDREDWAYS_GATE_RECEIPT"],
              decision,
              candidate_root=os.path.join(updates, snapshot_name),
              artifact_path=os.environ["HUNDREDWAYS_ZIP"],
          )
          PYEOF

      - name: Upload branded zip + reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nastech-agent-update
          path: |
            ${{ runner.temp }}/nastech-agent-update.zip
            ${{ runner.temp }}/Updates-Commits/*/UPDATE-REPORT.md
            ${{ runner.temp }}/Updates-Commits/*/GATE-REPORT.md
            ${{ runner.temp }}/weekly-full-sync-report.md
            ${{ runner.temp }}/weekly-decision.json
            ${{ runner.temp }}/publication-readiness.json
            ${{ runner.temp }}/candidate-conformance.json
            ${{ runner.temp }}/candidate-tests.json
            ${{ runner.temp }}/candidate-post-test-conformance.json
            ${{ runner.temp }}/gate_receipt.json
            ${{ runner.temp }}/SYNC-SUMMARY.md
          if-no-files-found: error
