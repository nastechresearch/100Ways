name: stage-pipeline

# Stage 5: run the full 19-stage update pipeline against a fresh direct
# source clone. Source SHA and file-census evidence bind every candidate to the
# exact fetched source; the full branded-candidate test suite is the test gate.
# Passes --fork-root nastech-agent (the shallow fork clone) so the preserve
# stage carries fork-local files into the snapshot and the forkcheck stage
# proves the tree is byte-faithful to the fork before anything ships.

on:
  workflow_call:
    inputs:
      hermes_url:
        description: Hermes repo URL (defaults to NousResearch/hermes-agent)
        type: string
        required: false
        default: "https://github.com/NousResearch/hermes-agent.git"
      project_name:
        description: Branded project folder name inside the zip
        type: string
        required: false
        default: "nastech-agent"
    outputs:
      update_number:
        description: Sequential Nastech-Update#N assigned by the pipeline
        value: ${{ jobs.pipeline.outputs.update_number }}
      upstream_sha:
        description: Upstream Hermes commit that was branded
        value: ${{ jobs.pipeline.outputs.upstream_sha }}
      gate:
        description: Final gate result (PASS / WITHHELD)
        value: ${{ jobs.pipeline.outputs.gate }}
    secrets:
      OLLAMA_API_KEY:
        description: Optional Ollama Cloud key for advisory text reviews
        required: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    outputs:
      update_number: ${{ steps.candidate-state.outputs.update_number }}
      upstream_sha: ${{ steps.candidate-state.outputs.upstream_sha }}
      gate: ${{ steps.final-gate.outputs.gate }}
      decision: ${{ steps.final-gate.outputs.decision }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.2.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install 100ways
        run: pip install -e .

      - name: Install candidate test search prerequisite
        run: |
          set -euo pipefail
          RG_VERSION=15.1.0
          RG_SHA256=1c9297be4a084eea7ecaedf93eb03d058d6faae29bbc57ecdaf5063921491599
          RG_TARBALL=ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl.tar.gz
          curl -sSfL --retry 3 --retry-delay 5 -o "$RG_TARBALL" \
            "https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}/${RG_TARBALL}"
          echo "${RG_SHA256}  ${RG_TARBALL}" | sha256sum -c -
          tar -xzf "$RG_TARBALL"
          sudo mv "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl/rg" /usr/local/bin/rg
          rm -rf "$RG_TARBALL" "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl"
          rg --version

      - name: Install locked candidate-test environment manager
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.9.28"
          enable-cache: true

      - name: Shallow clone of the fork (owned-assets registry)
        run: |
          git clone --depth=1 \
            https://github.com/nastechresearch/nastech-agent.git nastech-agent

      - name: Capture direct upstream source evidence
        id: direct-source
        env:
          HUNDREDWAYS_HERMES_URL: ${{ inputs.hermes_url }}
        run: |
          set -euo pipefail
          DIRECT_SHA=$(git ls-remote "$HUNDREDWAYS_HERMES_URL" HEAD | awk 'NR == 1 {print $1}')
          test -n "$DIRECT_SHA"
          echo "sha=$DIRECT_SHA" >> "$GITHUB_OUTPUT"
          echo "- Direct upstream SHA: \`$DIRECT_SHA\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Run 19-stage update pipeline with fresh direct-source evidence
        id: update
        continue-on-error: true
        env:
          HUNDREDWAYS_HERMES_URL: ${{ inputs.hermes_url }}
          HUNDREDWAYS_UPDATES_DIR: ${{ runner.temp }}/Updates-Commits
          HUNDREDWAYS_OUTPUTS: ${{ runner.temp }}/update-outputs.json
          HUNDREDWAYS_ZIP: ${{ runner.temp }}/nastech-agent-update.zip
          HUNDREDWAYS_AI_PROVIDER: ollama-cloud
          HUNDREDWAYS_AI_BASE_URL: https://ollama.com/v1
          HUNDREDWAYS_AI_MODEL: gemma4:31b-cloud
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
        run: |
          set -o pipefail
          python3 -m hundredways.cli --repo nastech-agent update \
            --updates-dir "$HUNDREDWAYS_UPDATES_DIR" \
            --hermes-url "$HUNDREDWAYS_HERMES_URL" \
            --fork-root nastech-agent \
            --owned-assets-root "$GITHUB_WORKSPACE/config/owned-assets" \
            --zip "$HUNDREDWAYS_ZIP" \
            --project-name "${{ inputs.project_name }}" \
            --emit-outputs "$HUNDREDWAYS_OUTPUTS" 2>&1 | tee "$RUNNER_TEMP/update-pipeline.log"
          echo "pipeline_status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Classify candidate availability
        id: candidate-state
        env:
          HUNDREDWAYS_UPDATES_DIR: ${{ runner.temp }}/Updates-Commits
          HUNDREDWAYS_OUTPUTS: ${{ runner.temp }}/update-outputs.json
          DIRECT_UPSTREAM_SHA: ${{ steps.direct-source.outputs.sha }}
        run: |
          set -euo pipefail
          if [ "${{ steps.update.outputs.pipeline_status }}" != "0" ]; then
            {
              echo "candidate_ready=false"
              echo "update_number="
              echo "upstream_sha=$DIRECT_UPSTREAM_SHA"
            } >> "$GITHUB_OUTPUT"
            {
              echo "## Candidate withheld"
              echo "- The update pipeline did not create a complete candidate."
              echo "- Candidate tests, packaging, upload, and publication: **WITHHELD**."
              echo "- Publication allowed: **NO**."
              echo "- See the advisory-only analysis and update-pipeline log for the pipeline failure."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 - <<'EOF'
          import json, os
          with open(os.environ["HUNDREDWAYS_OUTPUTS"], encoding="utf-8") as fh:
              out = json.load(fh)
          snapshot = os.path.join(
              os.environ["HUNDREDWAYS_UPDATES_DIR"],
              f"Nastech-Update#{out['update_number']}",
          )
          with open(os.path.join(snapshot, "manifest.json"), encoding="utf-8") as fh:
              manifest = json.load(fh)
          provenance = manifest["source_provenance"]
          census = provenance["source_census"]
          if (
              manifest.get("upstream_sha") != out.get("upstream_sha")
              or not isinstance(census.get("files"), int)
              or census["files"] < 1
          ):
              raise SystemExit("direct upstream source evidence is incomplete")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as gh:
              gh.write("candidate_ready=true\n")
              gh.write(f"update_number={out.get('update_number', '')}\n")
              gh.write(f"upstream_sha={out.get('upstream_sha', '')}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Direct upstream source evidence\n")
              summary.write("- Canonical upstream test execution: **NOT RUN**.\n")
              summary.write(f"- Source SHA: `{manifest['upstream_sha']}`.\n")
              summary.write(f"- Source files: {census['files']}.\n")
          EOF

      - name: Advisory-only remediation analysis for failed update pipeline
        if: ${{ steps.update.outputs.pipeline_status != '0' }}
        env:
          HUNDREDWAYS_AI_PROVIDER: ollama-cloud
          HUNDREDWAYS_AI_BASE_URL: https://ollama.com/v1
          HUNDREDWAYS_AI_MODEL: gemma4:31b-cloud
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          REMEDIATION_REPORT: ${{ runner.temp }}/remediation-advisory.json
        run: |
          set -euo pipefail
          python3 scripts/analyze_failure.py \
            --log "$RUNNER_TEMP/update-pipeline.log" \
            --output "$REMEDIATION_REPORT" || true
          echo "## Advisory-only remediation" >> "$GITHUB_STEP_SUMMARY"
          echo "- A redacted Ollama explanation was generated when available." >> "$GITHUB_STEP_SUMMARY"
          echo "- It cannot change code, retry a gate, publish, merge, tag, release, or deploy." >> "$GITHUB_STEP_SUMMARY"
          cat "$REMEDIATION_REPORT" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Run hardened weekly decision gate
        id: weekly
        if: ${{ steps.candidate-state.outputs.candidate_ready == 'true' }}
        env:
          HUNDREDWAYS_UPDATES_DIR: ${{ runner.temp }}/Updates-Commits
          HUNDREDWAYS_STATE_DIR: ${{ runner.temp }}/100ways-state
          HUNDREDWAYS_WEEKLY_REPORT: ${{ runner.temp }}/weekly-full-sync-report.md
          HUNDREDWAYS_DECISION: ${{ runner.temp }}/weekly-decision.json
        run: |
          set -euo pipefail
          SNAPSHOT=$(find "$HUNDREDWAYS_UPDATES_DIR" -maxdepth 1 -type d -name 'Nastech-Update#*' | sort -V | tail -1)
          test -n "$SNAPSHOT"
          python3 - <<'PYEOF'
          import json
          import os
          from hundredways.weekly_sync import build_weekly_report, write_weekly_report

          updates = os.environ["HUNDREDWAYS_UPDATES_DIR"]
          candidates = sorted(
              (name for name in os.listdir(updates) if name.startswith("Nastech-Update#")),
              key=lambda value: int(value.rsplit("#", 1)[-1]),
          )
          snapshot = os.path.join(updates, candidates[-1])
          report = build_weekly_report(
              os.path.join(updates, "hermes-agent"),
              snapshot,
              os.environ["HUNDREDWAYS_STATE_DIR"],
              mode="snapshot",
          )
          write_weekly_report(os.environ["HUNDREDWAYS_WEEKLY_REPORT"], report)
          with open(os.environ["HUNDREDWAYS_DECISION"], "w", encoding="utf-8") as fh:
              json.dump(report.to_dict(), fh, indent=2)
          if not report.gate_passes:
              raise SystemExit("hard weekly full-sync gate failed")
          PYEOF
          DECISION=$(jq -r '.gate' "$HUNDREDWAYS_DECISION")
          echo "hard_gate=PASS" >> "$GITHUB_OUTPUT"
          echo "decision=$DECISION" >> "$GITHUB_OUTPUT"
          echo "## Hardened weekly decision" >> "$GITHUB_STEP_SUMMARY"
          echo "- Hard gate: **PASS**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Decision: \`$DECISION\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Run source-provenance and publication-readiness scans
        id: readiness
        if: ${{ steps.candidate-state.outputs.candidate_ready == 'true' }}
        env:
          HUNDREDWAYS_UPDATES_DIR: ${{ runner.temp }}/Updates-Commits
          EXPECTED_UPSTREAM_SHA: ${{ steps.direct-source.outputs.sha }}
          HUNDREDWAYS_READINESS: ${{ runner.temp }}/publication-readiness.json
        run: |
          set -euo pipefail
          SNAPSHOT=$(find "$HUNDREDWAYS_UPDATES_DIR" -maxdepth 1 -type d -name 'Nastech-Update#*' | sort -V | tail -1)
          python3 -m hundredways.prepublish \
            --snapshot "$SNAPSHOT" \
            --upstream "$HUNDREDWAYS_UPDATES_DIR/hermes-agent" \
            --expected-upstream-sha "$EXPECTED_UPSTREAM_SHA" \
            --output "$HUNDREDWAYS_READINESS"
          python3 - <<'PYEOF'
          import json
          import os

          with open(os.environ["HUNDREDWAYS_READINESS"], encoding="utf-8") as handle:
              audit = json.load(handle)["reference_audit"]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Strict upstream-brand accounting\\n")
              for token in ("hermes", "nous"):
                  raw = audit["raw_occurrences"][token]
                  allowed = audit["approved_occurrences"][token]
                  lexical = audit["lexical_occurrences"][token]
                  blocked = audit["blocking_occurrences"][token]
                  summary.write(
                      f"- `{token}`: raw={raw}; approved={allowed}; lexical={lexical}; blocking={blocked}\\n"
                  )
              summary.write("- Gate: **PASS** — only approved dependency records and exact summary attribution remain.\\n")
          PYEOF
          echo "readiness=PASS" >> "$GITHUB_OUTPUT"
          echo "- Publication readiness: **PASS**" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify final branded candidate against exact Hermes source
        id: final-conformance
        if: ${{ steps.candidate-state.outputs.candidate_ready == 'true' }}
        env:
          HUNDREDWAYS_UPDATES_DIR: ${{ runner.temp }}/Updates-Commits
          HUNDREDWAYS_CONFORMANCE: ${{ runner.temp }}/candidate-conformance.json
        run: |
          set -euo pipefail
          SNAPSHOT=$(find "$HUNDREDWAYS_UPDATES_DIR" -maxdepth 1 -type d -name 'Nastech-Update#*' | sort -V | tail -1)
          python3 -m hundredways.conformance \
            --source "$HUNDREDWAYS_UPDATES_DIR/hermes-agent" \
            --candidate "$SNAPSHOT" \
            --owned-assets-root "$GITHUB_WORKSPACE/config/owned-assets" \
            --output "$HUNDREDWAYS_CONFORMANCE"
          echo "conformance=PASS" >> "$GITHUB_OUTPUT"
          echo "- Final branded-tree conformance: **PASS**" >> "$GITHUB_STEP_SUMMARY"

      - name: Run baseline-aware final branded candidate tests
        id: candidate-tests
        if: ${{ steps.candidate-state.outputs.candidate_ready == 'true' }}
        env:
          HUNDREDWAYS_UPDATES_DIR: ${{ runner.temp }}/Updates-Commits
          HUNDREDWAYS_CANDIDATE_TESTS: ${{ runner.temp }}/candidate-tests.json
          HUNDREDWAYS_UPSTREAM_TESTS: ${{ runner.temp }}/upstream-tests.log
          DIRECT_UPSTREAM_SHA: ${{ steps.direct-source.outputs.sha }}
        run: |
          set -euo pipefail
          SNAPSHOT=$(find "$HUNDREDWAYS_UPDATES_DIR" -maxdepth 1 -type d -name 'Nastech-Update#*' | sort -V | tail -1)
          UPSTREAM="$HUNDREDWAYS_UPDATES_DIR/hermes-agent"
          TEST_TREE="$RUNNER_TEMP/nastech-agent-candidate-test"
          CANDIDATE_LOG="$RUNNER_TEMP/candidate-tests.log"
          CANDIDATE_CONFIRMED_LOG="$RUNNER_TEMP/candidate-confirmed-tests.log"
          rm -rf "$TEST_TREE"
          cp -a "$SNAPSHOT" "$TEST_TREE"
          test -x "$TEST_TREE/scripts/run_tests.sh"
          (
            cd "$TEST_TREE"
            git init -q
            git config user.email "100ways-candidate-test@invalid"
            git config user.name "100Ways Candidate Test"
            git add -A
            uv python install 3.11
            uv sync --locked --python 3.11 \
              --extra all --extra dev --extra anthropic --extra mistral \
              --extra fal --extra modal --extra daytona --extra hindsight \
              --extra parallel-web
          )
          (
            cd "$UPSTREAM"
            uv python install 3.11
            uv sync --locked --python 3.11 \
              --extra all --extra dev --extra anthropic --extra mistral \
              --extra fal --extra modal --extra daytona --extra hindsight \
              --extra parallel-web
          )

          python3 -m hundredways.test_baseline_runner \
            --candidate "$TEST_TREE" \
            --candidate-artifact "$SNAPSHOT" \
            --source "$UPSTREAM" \
            --source-sha "$DIRECT_UPSTREAM_SHA" \
            --output "$HUNDREDWAYS_CANDIDATE_TESTS" \
            --candidate-raw-log "$CANDIDATE_LOG" \
            --candidate-confirmed-log "$CANDIDATE_CONFIRMED_LOG" \
            --source-log "$HUNDREDWAYS_UPSTREAM_TESTS"
          HUNDREDWAYS_CANDIDATE_CONFIRMED_TESTS="$CANDIDATE_CONFIRMED_LOG" \
          python3 - <<'PYEOF'
          import json
          import os

          with open(os.environ["HUNDREDWAYS_CANDIDATE_TESTS"], encoding="utf-8") as handle:
              evidence = json.load(handle)
          review_ready = bool(evidence["review_ready"])
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as gh:
              gh.write(f"review_ready={'true' if review_ready else 'false'}\n")
              gh.write(f"candidate_tests={evidence['gate']}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Baseline-aware candidate tests\n")
              summary.write(f"- Parallel candidate failures: {len(evidence['parallel_candidate_failures'])}.\n")
              summary.write(f"- Serial candidate failures: {len(evidence['candidate_failed'])}.\n")
              summary.write(f"- Serial exact-source failures: {len(evidence['source_failed'])}.\n")
              summary.write(f"- Inherited failures: {len(evidence['inherited_failures'])}.\n")
              summary.write(f"- NasTech-only failures: {len(evidence['nastech_only_failures'])}.\n")
              summary.write(f"- Unresolved candidate failures: {len(evidence['unresolved_candidate_failures'])}.\n")
              summary.write(f"- Classification: **{evidence['classification']}**.\n")
              summary.write(f"- Review eligibility: **{'PASS' if review_ready else 'WITHHELD'}**.\n")
          PYEOF

      - name: Re-attest candidate after tests
        if: ${{ steps.candidate-state.outputs.candidate_ready == 'true' && steps.candidate-tests.outputs.review_ready == 'true' }}
        env:
          HUNDREDWAYS_UPDATES_DIR: ${{ runner.temp }}/Updates-Commits
          HUNDREDWAYS_POST_TEST_CONFORMANCE: ${{ runner.temp }}/candidate-post-test-conformance.json
        run: |
          set -euo pipefail
          SNAPSHOT=$(find "$HUNDREDWAYS_UPDATES_DIR" -maxdepth 1 -type d -name 'Nastech-Update#*' | sort -V | tail -1)
          python3 -m hundredways.conformance \
            --source "$HUNDREDWAYS_UPDATES_DIR/hermes-agent" \
            --candidate "$SNAPSHOT" \
            --owned-assets-root "$GITHUB_WORKSPACE/config/owned-assets" \
            --output "$HUNDREDWAYS_POST_TEST_CONFORMANCE"
          echo "- Post-test candidate conformance: **PASS**" >> "$GITHUB_STEP_SUMMARY"

      - name: Write final pipeline gate
        id: final-gate
        if: ${{ always() }}
        run: |
          set -euo pipefail
          if [ "${{ steps.candidate-state.outputs.candidate_ready }}" = "true" ] \
            && [ "${{ steps.weekly.outcome }}" = "success" ] \
            && [ "${{ steps.readiness.outcome }}" = "success" ] \
            && [ "${{ steps.final-conformance.outcome }}" = "success" ] \
            && [ "${{ steps.candidate-tests.outputs.review_ready }}" = "true" ] \
            && [ "${{ steps.candidate-tests.outcome }}" = "success" ] \
            && [ "${{ steps.post-test-conformance.outcome }}" = "success" ]; then
            echo "gate=PASS" >> "$GITHUB_OUTPUT"
            echo "decision=REVIEW_READY" >> "$GITHUB_OUTPUT"
            echo "## Final pipeline gate" >> "$GITHUB_STEP_SUMMARY"
            echo "- Decision: **PASS** — review PR preparation is authorized." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "gate=WITHHELD" >> "$GITHUB_OUTPUT"
            echo "decision=CANDIDATE_VALIDATION_FAILURE" >> "$GITHUB_OUTPUT"
            echo "## Final pipeline gate" >> "$GITHUB_STEP_SUMMARY"
            echo "- Decision: **WITHHELD** — candidate validation did not meet review eligibility." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Write professional update summary
        if: ${{ steps.final-gate.outputs.gate == 'PASS' }}
        env:
          HUNDREDWAYS_UPDATES_DIR: ${{ runner.temp }}/Updates-Commits
          HUNDREDWAYS_SUMMARY: ${{ runner.temp }}/SYNC-SUMMARY.md
          EXPECTED_UPSTREAM_SHA: ${{ steps.direct-source.outputs.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import json
          import os
          from hundredways.sync_summary import write_sync_summary

          updates = os.environ["HUNDREDWAYS_UPDATES_DIR"]
          snapshot_name = sorted((name for name in os.listdir(updates) if name.startswith("Nastech-Update#")), key=lambda value: int(value.rsplit("#", 1)[-1]))[-1]
          snapshot = os.path.join(updates, snapshot_name)
          with open(os.path.join(snapshot, "manifest.json"), encoding="utf-8") as fh:
              manifest = json.load(fh)
          try:
              with open("nastech-agent/manifest.json", encoding="utf-8") as fh:
                  baseline = json.load(fh).get("upstream_sha", "")
          except (OSError, ValueError):
              baseline = ""
          verification = (
              ("Direct source provenance", "Passed"),
              ("Brand and asset integrity", "Passed"),
              ("Dependency, security, and publication-readiness scans", "Passed"),
              ("Full verification and fork-consistency checks", "Passed"),
          )
          write_sync_summary(
              os.environ["HUNDREDWAYS_SUMMARY"],
              upstream_repo=os.path.join(updates, "hermes-agent"),
              baseline_sha=baseline,
              upstream_sha=manifest["upstream_sha"],
              files_changed=sum(int(manifest.get("diff", {}).get(key, 0)) for key in ("renamed", "rewritten", "missing")),
              changed_areas=manifest.get("changed_areas", {}),
              verification=verification,
              commit_subjects=manifest.get("commit_subjects", ()),
          )
          PYEOF

      - name: Repackage the exact verified tree
        if: ${{ steps.final-gate.outputs.gate == 'PASS' }}
        env:
          HUNDREDWAYS_UPDATES_DIR: ${{ runner.temp }}/Updates-Commits
          HUNDREDWAYS_ZIP: ${{ runner.temp }}/nastech-agent-update.zip
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import os
          import zipfile

          updates = os.environ["HUNDREDWAYS_UPDATES_DIR"]
          candidates = sorted(
              (name for name in os.listdir(updates) if name.startswith("Nastech-Update#")),
              key=lambda value: int(value.rsplit("#", 1)[-1]),
          )
          snapshot = os.path.join(updates, candidates[-1])
          reports = {"UPDATE-REPORT.md", "GATE-REPORT.md"}
          with zipfile.ZipFile(os.environ["HUNDREDWAYS_ZIP"], "w", zipfile.ZIP_DEFLATED) as archive:
              for current, dirs, files in os.walk(snapshot):
                  dirs[:] = [name for name in dirs if name != ".git"]
                  for name in files:
                      source = os.path.join(current, name)
                      relative = os.path.relpath(source, snapshot)
                      if relative in reports:
                          continue
                      archive.write(source, os.path.join("nastech-agent", relative))
              for report in reports:
                  source = os.path.join(snapshot, report)
                  if os.path.isfile(source):
                      archive.write(source, report)
              summary = os.path.join(os.path.dirname(updates), "SYNC-SUMMARY.md")
              if os.path.isfile(summary):
                  archive.write(summary, "SYNC-SUMMARY.md")
          PYEOF

      - name: Write tamper-evident gate decision receipt
        if: ${{ steps.final-gate.outputs.gate == 'PASS' }}
        env:
          HUNDREDWAYS_UPDATES_DIR: ${{ runner.temp }}/Updates-Commits
          HUNDREDWAYS_DECISION: ${{ runner.temp }}/weekly-decision.json
          HUNDREDWAYS_ZIP: ${{ runner.temp }}/nastech-agent-update.zip
          HUNDREDWAYS_GATE_RECEIPT: ${{ runner.temp }}/gate_receipt.json
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import json
          import os
          from hundredways.receipts import write_gate_decision_receipt

          updates = os.environ["HUNDREDWAYS_UPDATES_DIR"]
          snapshot_name = sorted(
              (name for name in os.listdir(updates) if name.startswith("Nastech-Update#")),
              key=lambda value: int(value.rsplit("#", 1)[-1]),
          )[-1]
          with open(os.environ["HUNDREDWAYS_DECISION"], encoding="utf-8") as handle:
              decision = json.load(handle)
          if decision.get("gate") != "PASS":
              raise SystemExit("cannot authorize an artifact without a PASS gate")
          write_gate_decision_receipt(
              os.environ["HUNDREDWAYS_GATE_RECEIPT"],
              decision,
              candidate_root=os.path.join(updates, snapshot_name),
              artifact_path=os.environ["HUNDREDWAYS_ZIP"],
          )
          PYEOF

      - name: Upload branded zip + reports
        if: ${{ steps.final-gate.outputs.gate == 'PASS' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nastech-agent-update
          path: |
            ${{ runner.temp }}/nastech-agent-update.zip
            ${{ runner.temp }}/Updates-Commits/*/UPDATE-REPORT.md
            ${{ runner.temp }}/Updates-Commits/*/GATE-REPORT.md
            ${{ runner.temp }}/weekly-full-sync-report.md
            ${{ runner.temp }}/weekly-decision.json
            ${{ runner.temp }}/publication-readiness.json
            ${{ runner.temp }}/candidate-conformance.json
            ${{ runner.temp }}/candidate-tests.json
            ${{ runner.temp }}/candidate-tests.log
