name: stage-pipeline

# Stage 5: run the full 19-stage update pipeline against the direct source
# repo, gate it, and upload the branded zip + reports as an artifact.
# Keeps the immutable data files (contributors/emails) verbatim.
# Passes --fork-root nastech-agent (the shallow fork clone) so the preserve
# stage carries fork-local files into the snapshot and the internal fork-
# consistency check verifies the candidate before anything ships. This
# workflow does not execute the fork's application test suite.

on:
  workflow_call:
    inputs:
      hermes_url:
        description: Hermes repo URL (defaults to NousResearch/hermes-agent)
        type: string
        required: false
        default: "https://github.com/NousResearch/hermes-agent.git"
      project_name:
        description: Branded project folder name inside the zip
        type: string
        required: false
        default: "nastech-agent"
    outputs:
      update_number:
        description: Sequential Nastech-Update#N assigned by the pipeline
        value: ${{ jobs.pipeline.outputs.update_number }}
      upstream_sha:
        description: Upstream Hermes commit that was branded
        value: ${{ jobs.pipeline.outputs.upstream_sha }}
      gate:
        description: Final gate result (PASS / FAIL)
        value: ${{ jobs.pipeline.outputs.gate }}
    secrets:
      OLLAMA_API_KEY:
        description: Optional Ollama Cloud key for advisory text reviews
        required: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    outputs:
      update_number: ${{ steps.update.outputs.update_number }}
      upstream_sha: ${{ steps.update.outputs.upstream_sha }}
      gate: ${{ steps.weekly.outputs.hard_gate }}
      decision: ${{ steps.weekly.outputs.decision }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.2.2

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install 100ways
        # The ai extra is what lets the review narrative ask Ollama for one prose
        # paragraph; without it the narrative silently stays deterministic-only.
        run: pip install -e ".[ai]"

      - name: Install candidate test search prerequisite
        run: |
          set -euo pipefail
          RG_VERSION=15.1.0
          RG_SHA256=1c9297be4a084eea7ecaedf93eb03d058d6faae29bbc57ecdaf5063921491599
          RG_TARBALL=ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl.tar.gz
          curl -sSfL --retry 3 --retry-delay 5 -o "$RG_TARBALL" \
            "https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}/${RG_TARBALL}"
          echo "${RG_SHA256}  ${RG_TARBALL}" | sha256sum -c -
          tar -xzf "$RG_TARBALL"
          sudo mv "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl/rg" /usr/local/bin/rg
          rm -rf "$RG_TARBALL" "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl"
          rg --version

      - name: Shallow clone of the fork (owned-assets registry)
        run: |
          git clone --depth=1 \
            https://github.com/nastechresearch/nastech-agent.git nastech-agent

      # The publication-readiness scan simulates the fork's blocking `ruff check .`, and
      # an absent ruff is reported as UNAVAILABLE, which is blocking -- so the version the
      # fork itself pins has to be the one installed here.  The pin comes from the fork's
      # own pyproject.toml, the same file its lint lane resolves pins from
      # (scripts.code_health --print-pins), so this step follows the fork when it bumps.
      - name: Install the ruff the fork pins
        run: |
          set -euo pipefail
          PIN=$(python3 -c 'from hundredways.forklint import read_fork_ruff_pin; print(read_fork_ruff_pin("nastech-agent"))')
          if [ -z "$PIN" ]; then
            echo "::error::nastech-agent/pyproject.toml pins no ruff, so the fork's blocking ruff check cannot be simulated here"
            exit 1
          fi
          python3 -m pip install "ruff==$PIN"
          ruff --version

      - name: Clone upstream source once
        env:
          HUNDREDWAYS_HERMES_URL: ${{ inputs.hermes_url }}
        run: |
          set -euo pipefail
          rm -rf upstream-agent
          # Name the consumed ref: a bare clone silently follows the remote's
          # mutable default branch, so an upstream default-branch flip would
          # change the revision this run brands and publishes with no diff
          # landing here.  `--branch main` keeps the sync functional (the ref is
          # moving by design) while making silent default-branch drift a loud
          # clone failure.  A commit SHA cannot be used: the pipeline brands the
          # live upstream HEAD and records that SHA in manifest.json
          # (hundredways/integrity.py verifies manifest SHA == fetched HEAD).
          for attempt in 1 2 3 4 5; do
            if git -c http.version=HTTP/1.1 clone --branch main "$HUNDREDWAYS_HERMES_URL" upstream-agent; then
              break
            fi
            echo "Upstream clone failed (attempt $attempt/5); retrying..." >&2
            rm -rf upstream-agent
            sleep $((attempt * 10))
          done
          test -d upstream-agent/.git

      - name: Capture direct upstream source evidence
        id: direct-source
        run: |
          set -euo pipefail
          DIRECT_SHA=$(git -C upstream-agent rev-parse HEAD)
          test -n "$DIRECT_SHA"
          echo "sha=$DIRECT_SHA" >> "$GITHUB_OUTPUT"
          echo "- Direct upstream SHA: \`$DIRECT_SHA\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Run 19-stage update pipeline
        id: update
        env:
          HUNDREDWAYS_HERMES_URL: ${{ github.workspace }}/upstream-agent
          HUNDREDWAYS_PROVENANCE_URL: ${{ inputs.hermes_url }}
          HUNDREDWAYS_UPDATES_DIR: ${{ runner.temp }}/Updates-Commits
          HUNDREDWAYS_OUTPUTS: ${{ runner.temp }}/update-outputs.json
          HUNDREDWAYS_ZIP: ${{ runner.temp }}/nastech-agent-update.zip
          HUNDREDWAYS_AI_PROVIDER: ollama-cloud
          HUNDREDWAYS_AI_BASE_URL: https://ollama.com/v1
          HUNDREDWAYS_AI_MODEL: gemma4:31b-cloud
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
        run: |
          python3 -m hundredways.cli --repo nastech-agent update \
            --updates-dir "$HUNDREDWAYS_UPDATES_DIR" \
            --hermes-url "$HUNDREDWAYS_HERMES_URL" \
            --source-provenance-url "$HUNDREDWAYS_PROVENANCE_URL" \
            --fork-root nastech-agent \
            --owned-assets-root "$GITHUB_WORKSPACE/config/owned-assets" \
            --zip "$HUNDREDWAYS_ZIP" \
            --project-name "${{ inputs.project_name }}" \
            --emit-outputs "$HUNDREDWAYS_OUTPUTS"
          python3 - <<'EOF'
          import json, os
          with open(os.environ["HUNDREDWAYS_OUTPUTS"]) as fh:
              out = json.load(fh)
          with open(os.environ["GITHUB_OUTPUT"], "a") as gh:
              for key in ("update_number", "upstream_sha"):
                  gh.write(f"{key}={out.get(key, '')}\n")
          EOF

      - name: Run hardened weekly decision gate
        id: weekly
        env:
          HUNDREDWAYS_UPDATES_DIR: ${{ runner.temp }}/Updates-Commits
          HUNDREDWAYS_STATE_DIR: ${{ runner.temp }}/100ways-state
          HUNDREDWAYS_UPSTREAM_SHA: ${{ steps.update.outputs.upstream_sha }}
          HUNDREDWAYS_WEEKLY_REPORT: ${{ runner.temp }}/weekly-full-sync-report.md
          HUNDREDWAYS_DECISION: ${{ runner.temp }}/weekly-decision.json
        run: |
          set -euo pipefail
          SNAPSHOT=$(find "$HUNDREDWAYS_UPDATES_DIR" -maxdepth 1 -type d -name 'Nastech-Update#*' | sort -V | tail -1)
          test -n "$SNAPSHOT"
          python3 - <<'PYEOF'
          import json
          import os
          from hundredways.weekly_sync import build_weekly_report, write_weekly_report

          updates = os.environ["HUNDREDWAYS_UPDATES_DIR"]
          candidates = sorted(
              (name for name in os.listdir(updates) if name.startswith("Nastech-Update#")),
              key=lambda value: int(value.rsplit("#", 1)[-1]),
          )
          snapshot = os.path.join(updates, candidates[-1])
          report = build_weekly_report(
              os.path.join(updates, "hermes-agent"),
              snapshot,
              os.environ["HUNDREDWAYS_STATE_DIR"],
              mode="snapshot",
              ref=os.environ["HUNDREDWAYS_UPSTREAM_SHA"] or "origin/main",
          )
          write_weekly_report(os.environ["HUNDREDWAYS_WEEKLY_REPORT"], report)
          with open(os.environ["HUNDREDWAYS_DECISION"], "w", encoding="utf-8") as fh:
              json.dump(report.to_dict(), fh, indent=2)
          PYEOF
          DECISION=$(jq -r '.gate' "$HUNDREDWAYS_DECISION")
          BLOCKER_COUNT=$(jq '.gate_blockers | length' "$HUNDREDWAYS_DECISION")
          echo "hard_gate=$DECISION" >> "$GITHUB_OUTPUT"
          echo "decision=$DECISION" >> "$GITHUB_OUTPUT"
          {
            echo "## Hardened weekly decision"
            echo "- Hard gate: **$DECISION**"
            echo "- Hard blockers: **$BLOCKER_COUNT**"
            echo
            cat "$HUNDREDWAYS_WEEKLY_REPORT"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Weekly gate decision: $DECISION ($BLOCKER_COUNT hard blockers)"
          jq -r '.gate_blockers[]? | "- [\(.category)] \(.code) \(.path): \(.detail)"' "$HUNDREDWAYS_DECISION"
          if [ "$DECISION" != "PASS" ]; then
            echo "hard weekly full-sync gate failed with $BLOCKER_COUNT blocker(s)"
            exit 1
          fi

      - name: Upload weekly gate diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: weekly-gate-diagnostics
          path: |
            ${{ runner.temp }}/weekly-full-sync-report.md
            ${{ runner.temp }}/weekly-decision.json
          if-no-files-found: warn
          retention-days: 14

      - name: Run source-provenance and publication-readiness scans
        id: readiness
        env:
          HUNDREDWAYS_UPDATES_DIR: ${{ runner.temp }}/Updates-Commits
          EXPECTED_UPSTREAM_SHA: ${{ steps.direct-source.outputs.sha }}
          HUNDREDWAYS_READINESS: ${{ runner.temp }}/publication-readiness.json
        run: |
          set -euo pipefail
          SNAPSHOT=$(find "$HUNDREDWAYS_UPDATES_DIR" -maxdepth 1 -type d -name 'Nastech-Update#*' | sort -V | tail -1)
          python3 -m hundredways.prepublish \
            --snapshot "$SNAPSHOT" \
            --upstream "$HUNDREDWAYS_UPDATES_DIR/hermes-agent" \
            --expected-upstream-sha "$EXPECTED_UPSTREAM_SHA" \
            --fork-root nastech-agent \
            --output "$HUNDREDWAYS_READINESS"
          echo "readiness=PASS" >> "$GITHUB_OUTPUT"
          echo "- Publication readiness: **PASS**" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify final branded candidate against exact Hermes source
        id: final-conformance
        env:
          HUNDREDWAYS_UPDATES_DIR: ${{ runner.temp }}/Updates-Commits
          HUNDREDWAYS_CONFORMANCE: ${{ runner.temp }}/candidate-conformance.json
        run: |
          set -euo pipefail
          SNAPSHOT=$(find "$HUNDREDWAYS_UPDATES_DIR" -maxdepth 1 -type d -name 'Nastech-Update#*' | sort -V | tail -1)
          python3 -m hundredways.conformance \
            --source "$HUNDREDWAYS_UPDATES_DIR/hermes-agent" \
            --candidate "$SNAPSHOT" \
            --owned-assets-root "$GITHUB_WORKSPACE/config/owned-assets" \
            --fork-root nastech-agent \
            --output "$HUNDREDWAYS_CONFORMANCE"
          echo "conformance=PASS" >> "$GITHUB_OUTPUT"
          echo "- Final branded-tree conformance: **PASS**" >> "$GITHUB_STEP_SUMMARY"

      # config/asset-policy.yml is the only statement of which classes of pixels a
      # Nastech release must own outright; the manifest can only say what it claims.
      # Two findings, two severities of consequence here:
      #   class-unowned  blocking.  The registry stopped covering a class the policy
      #                  requires, so every claim under that prefix has quietly
      #                  stopped landing -- an upstream directory rename does this.
      #   art-unclaimed  advisory.  Upstream art brands into a required class and no
      #                  manifest target names it, so their pixels ship under our
      #                  name.  15 of these are in the fork today (measured
      #                  2026-10-24 against nastech-agent@24b4c061, bytes verified
      #                  identical to the upstream twins they brand from), so
      #                  failing here would halt every sync over a brand decision
      #                  only the owner can make -- clearing them needs new owned
      #                  art, not a code change.  The list is written to the job
      #                  summary; move this to blocking when the count reaches zero.
      # Exit 2 (unreadable policy, missing tree) stays loud: an audit that did not
      # run cannot report an empty finding list.
      - name: Audit the candidate against the owned-asset policy
        env:
          HUNDREDWAYS_UPDATES_DIR: ${{ runner.temp }}/Updates-Commits
          HUNDREDWAYS_ASSET_AUDIT: ${{ runner.temp }}/asset-policy.json
        run: |
          set -euo pipefail
          SNAPSHOT=$(find "$HUNDREDWAYS_UPDATES_DIR" -maxdepth 1 -type d -name 'Nastech-Update#*' | sort -V | tail -1)
          test -n "$SNAPSHOT"
          status=0
          python3 -m hundredways.cli --repo "$GITHUB_WORKSPACE" assets \
            --tree "$SNAPSHOT" \
            --upstream "$HUNDREDWAYS_UPDATES_DIR/hermes-agent" \
            --json-out "$HUNDREDWAYS_ASSET_AUDIT" || status=$?
          if [ "$status" -gt 1 ]; then
            echo "::error::the owned-asset audit did not run (exit $status)"
            exit "$status"
          fi
          python3 - <<'PYEOF'
          import json
          import os

          with open(os.environ["HUNDREDWAYS_ASSET_AUDIT"], encoding="utf-8") as handle:
              audit = json.load(handle)
          findings = audit["findings"]
          groups: dict[str, list[dict[str, str]]] = {}
          for finding in findings:
              groups.setdefault(finding["code"], []).append(finding)
          hard = groups.get("class-unowned", [])
          art = groups.get("art-unclaimed", [])
          absent = groups.get("class-absent", [])
          summary = [
              "## Owned-asset policy over the candidate",
              f"- findings: **{len(findings)}** "
              f"(class-unowned {len(hard)}, art-unclaimed {len(art)}, class-absent {len(absent)})",
              f"- not measured: {', '.join(audit['not_measured']) or 'nothing'}",
          ]
          if art:
              summary.append("")
              summary.append("| path | role | detail |")
              summary.append("| --- | --- | --- |")
              summary.extend(
                  f"| `{item['path']}` | {item['role']} | {item['detail']} |" for item in art
              )
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write("\n".join(summary) + "\n")
          print(f"art-unclaimed (advisory): {len(art)}")
          if hard:
              raise SystemExit(
                  "required classes lost their registry claims: "
                  + ", ".join(sorted(item["path"] for item in hard))
              )
          PYEOF

      - name: Write professional update summary
        env:
          HUNDREDWAYS_UPDATES_DIR: ${{ runner.temp }}/Updates-Commits
          HUNDREDWAYS_SUMMARY: ${{ runner.temp }}/SYNC-SUMMARY.md
          HUNDREDWAYS_TITLE: ${{ runner.temp }}/SYNC-TITLE.md
          HUNDREDWAYS_PR_BODY: ${{ runner.temp }}/SYNC-PR-BODY.md
          EXPECTED_UPSTREAM_SHA: ${{ steps.direct-source.outputs.sha }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          HUNDREDWAYS_AI_PROVIDER: ollama-cloud
          HUNDREDWAYS_AI_BASE_URL: https://ollama.com/v1
          HUNDREDWAYS_AI_MODEL: gemma4:31b-cloud
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import json
          import os
          from pathlib import Path
          from hundredways.narrative import evidence_from_manifest, garnish, write_narrative
          from hundredways.sync_summary import write_sync_summary

          updates = os.environ["HUNDREDWAYS_UPDATES_DIR"]
          snapshot_name = sorted((name for name in os.listdir(updates) if name.startswith("Nastech-Update#")), key=lambda value: int(value.rsplit("#", 1)[-1]))[-1]
          snapshot = os.path.join(updates, snapshot_name)
          with open(os.path.join(snapshot, "manifest.json"), encoding="utf-8") as fh:
              manifest = json.load(fh)
          try:
              with open("nastech-agent/manifest.json", encoding="utf-8") as fh:
                  baseline = json.load(fh).get("upstream_sha", "")
          except (OSError, ValueError):
              baseline = ""
          write_sync_summary(
              os.environ["HUNDREDWAYS_SUMMARY"],
              upstream_repo=os.path.join(updates, "hermes-agent"),
              baseline_sha=baseline,
              upstream_sha=manifest["upstream_sha"],
              files_changed=sum(int(manifest.get("diff", {}).get(key, 0)) for key in ("renamed", "rewritten", "missing")),
              changed_areas=manifest.get("changed_areas", {}),
              verification=evidence_from_manifest(manifest),
              commit_subjects=manifest.get("commit_subjects", ()),
          )
          # The committed summary stays deterministic.  Advisory model prose is
          # appended only to the review PR body, never to a file in the tree.
          summary = Path(os.environ["HUNDREDWAYS_SUMMARY"]).read_text(encoding="utf-8")
          title = write_narrative(
              os.environ["HUNDREDWAYS_TITLE"],
              os.environ["HUNDREDWAYS_PR_BODY"],
              manifest=manifest,
              summary_markdown=summary,
              paragraph=garnish(manifest),
          )
          print(f"review title: {title} ({len(title)} chars)")
          PYEOF

      - name: Repackage the exact verified tree
        env:
          HUNDREDWAYS_UPDATES_DIR: ${{ runner.temp }}/Updates-Commits
          HUNDREDWAYS_ZIP: ${{ runner.temp }}/nastech-agent-update.zip
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import os
          import zipfile

          updates = os.environ["HUNDREDWAYS_UPDATES_DIR"]
          candidates = sorted(
              (name for name in os.listdir(updates) if name.startswith("Nastech-Update#")),
              key=lambda value: int(value.rsplit("#", 1)[-1]),
          )
          snapshot = os.path.join(updates, candidates[-1])
          reports = {"UPDATE-REPORT.md", "GATE-REPORT.md"}
          with zipfile.ZipFile(os.environ["HUNDREDWAYS_ZIP"], "w", zipfile.ZIP_DEFLATED) as archive:
              for current, dirs, files in os.walk(snapshot):
                  # Candidate reports are generated at archive root below;
                  # never carry a preserved reports/ directory from a prior
                  # fork snapshot into the review branch.
                  dirs[:] = [name for name in dirs if name not in {".git", "reports"}]
                  for name in files:
                      source = os.path.join(current, name)
                      relative = os.path.relpath(source, snapshot)
                      if relative in reports:
                          continue
                      archive.write(source, os.path.join("nastech-agent", relative))
              for report in reports:
                  source = os.path.join(snapshot, report)
                  if os.path.isfile(source):
                      archive.write(source, report)
              summary = os.path.join(os.path.dirname(updates), "SYNC-SUMMARY.md")
              if os.path.isfile(summary):
                  archive.write(summary, "SYNC-SUMMARY.md")
          PYEOF

      - name: Write tamper-evident gate decision receipt
        env:
          HUNDREDWAYS_UPDATES_DIR: ${{ runner.temp }}/Updates-Commits
          HUNDREDWAYS_DECISION: ${{ runner.temp }}/weekly-decision.json
          HUNDREDWAYS_ZIP: ${{ runner.temp }}/nastech-agent-update.zip
          HUNDREDWAYS_GATE_RECEIPT: ${{ runner.temp }}/gate_receipt.json
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import json
          import os
          from hundredways.receipts import write_gate_decision_receipt

          updates = os.environ["HUNDREDWAYS_UPDATES_DIR"]
          snapshot_name = sorted(
              (name for name in os.listdir(updates) if name.startswith("Nastech-Update#")),
              key=lambda value: int(value.rsplit("#", 1)[-1]),
          )[-1]
          with open(os.environ["HUNDREDWAYS_DECISION"], encoding="utf-8") as handle:
              decision = json.load(handle)
          if decision.get("gate") != "PASS":
              raise SystemExit("cannot authorize an artifact without a PASS gate")
          write_gate_decision_receipt(
              os.environ["HUNDREDWAYS_GATE_RECEIPT"],
              decision,
              candidate_root=os.path.join(updates, snapshot_name),
              artifact_path=os.environ["HUNDREDWAYS_ZIP"],
          )
          PYEOF

      - name: Upload branded zip + reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nastech-agent-update
          path: |
            ${{ runner.temp }}/nastech-agent-update.zip
            ${{ runner.temp }}/Updates-Commits/*/UPDATE-REPORT.md
            ${{ runner.temp }}/Updates-Commits/*/GATE-REPORT.md
            ${{ runner.temp }}/weekly-full-sync-report.md
            ${{ runner.temp }}/weekly-decision.json
            ${{ runner.temp }}/publication-readiness.json
            ${{ runner.temp }}/candidate-conformance.json
            ${{ runner.temp }}/asset-policy.json
            ${{ runner.temp }}/gate_receipt.json
            ${{ runner.temp }}/SYNC-SUMMARY.md
            ${{ runner.temp }}/SYNC-TITLE.md
            ${{ runner.temp }}/SYNC-PR-BODY.md
          if-no-files-found: error
