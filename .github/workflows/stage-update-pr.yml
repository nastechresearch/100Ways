name: "#344 — Push PR to NasTech"

# Final step #344: after every verification stage passes, push the branded tree to a test branch
# in the nastech-agent FORK and open/update a PR against its main.  The fork
# runs its own full CI (Python slices, JS checks, E2E, CodeQL) on that PR, so
# a green result proves the freshly-branded Hermes tree is sound enough to
# merge upstream.
#
#   pipeline (artifact: nastech-agent-update) --(this)--> 100WAYS (fork)
#   PR: 100WAYS  ->  main  (nastechresearch/nastech-agent)
#
# NOTE: the branch must NOT be named test/update-latest — the fork already has
# a branch literally named `test`, and git rejects test/* as a directory/file
# conflict. Use a name whose parent ref does not exist (100WAYS).
#
# Cross-repo writes need a PAT (contents: write + pull-requests: write scoped
# to nastechresearch/nastech-agent) in the NAS_TECH_AGENT_TOKEN secret.
# Each successful run commits the branded tree on top of the candidate
# branch's existing head — fast-forward only, never --force — so the branch
# accumulates one authored commit per update and the PR always shows the
# latest branded tree diff against fork main.

on:
  workflow_call:
    inputs:
      upstream_sha:
        description: Upstream Hermes commit that was branded
        type: string
        required: false
        default: ""
      gate:
        description: Final gate result (PASS / FAIL)
        type: string
        required: false
        default: "PASS"
    secrets:
      NAS_TECH_AGENT_TOKEN:
        description: Cross-repository PR token, scoped only to nastech-agent
        required: false

permissions:
  contents: read

jobs:
  update-pr:
    if: inputs.gate == 'PASS'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.2.2
        with:
          # Critical: without this, checkout writes http.extraheader with the
          # GITHUB_TOKEN, which OVERRIDES the PAT embedded in our remote URL on
          # every request. The push then authenticates as github-actions[bot]
          # (read works on public repos, write 403s). The PAT in the URL is
          # the only credential we want here.
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nastech-agent-update
          path: artifact

      - name: Extract branded tree
        run: |
          mkdir -p tree
          cd tree
          python3 - <<'EOF'
          import os
          import zipfile
          with zipfile.ZipFile("../artifact/nastech-agent-update.zip") as zf:
              zf.extractall(".")
              for info in zf.infolist():
                  mode = (info.external_attr >> 16) & 0o777
                  path = os.path.abspath(info.filename)
                  if mode and os.path.isfile(path):
                      os.chmod(path, mode)
              top = sorted(set(n.split("/", 1)[0] for n in zf.namelist()))
          print("extracted:", top)
          EOF
          # tree/ = nastech-agent/ + verification reports + professional summary (zip root)

      # Pull requests from forks do not receive repository secrets.  The
      # cross-repository PAT is therefore unavailable (or intentionally
      # invalid) in this validation context.  Keep the CI stage green and
      # reserve the write operation for trusted push, schedule, and manual
      # runs where the secret is available.
      - name: Skip cross-repository update for fork pull requests
        if: github.event_name == 'pull_request'
        run: echo "Skipping cross-repository update for fork pull request; repository secrets are unavailable."

      - name: Verify gate receipt and write #344 authorization
        if: github.event_name != 'pull_request'
        env:
          UPSTREAM_SHA: ${{ inputs.upstream_sha }}
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import os
          from hundredways.receipts import write_publication_authorization_receipt

          write_publication_authorization_receipt(
              "tree/PUBLICATION-AUTHORIZATION-RECEIPT.json",
              gate_receipt_path="artifact/gate_receipt.json",
              artifact_path="artifact/nastech-agent-update.zip",
              upstream_sha=os.environ["UPSTREAM_SHA"],
              candidate_branch="100WAYS",
              target_repository="nastechresearch/nastech-agent",
              target_base="main",
          )
          PYEOF

      - name: Commit branded tree to fork test branch
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.NAS_TECH_AGENT_TOKEN }}
        run: |
          set -eux
          FORK="nastechresearch/nastech-agent"
          BASE="main"
          TEST="100WAYS"
          SHA="${{ inputs.upstream_sha }}"
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${FORK}.git"

          # The commit author is the PAT's own identity, not the machine
          # bot: the candidate branch accumulates authored commits, and a
          # fast-forward-only history is auditable only against a real
          # owner.
          ACTOR_ID=$(gh api user --jq '.id')
          ACTOR_LOGIN=$(gh api user --jq '.login')
          export GIT_AUTHOR_NAME="$ACTOR_LOGIN"
          export GIT_AUTHOR_EMAIL="${ACTOR_ID}+${ACTOR_LOGIN}@users.noreply.github.com"
          export GIT_COMMITTER_NAME="$ACTOR_LOGIN"
          export GIT_COMMITTER_EMAIL="${ACTOR_ID}+${ACTOR_LOGIN}@users.noreply.github.com"

          # Read both heads up front: main is the accumulation floor, the
          # candidate branch's head the accumulation base.  When main has
          # advanced past the commit the branch was seeded from, the two lines
          # have diverged; the loop below rejoins them with an ours-merge before
          # the overlay so the push stays a fast-forward from the branch's own
          # head -- history is never rewritten and --force is never used.
          git fetch "$REMOTE" "refs/heads/$BASE:refs/factory/base" \
            "refs/heads/$TEST:refs/factory/candidate" 2>/dev/null \
            || git fetch "$REMOTE" "refs/heads/$BASE:refs/factory/base"
          BASE_SHA=$(git rev-parse refs/factory/base)
          pick_seed() {
            if git rev-parse -q --verify refs/factory/candidate >/dev/null; then
              git rev-parse refs/factory/candidate
            else
              echo "$BASE_SHA"
            fi
          }
          SEED=$(pick_seed)

          # Overlay the branded tree ONTO the checkout root.  The zip's
          # nastech-agent/ folder IS the whole project — the fork's content
          # lives at the repo root, NOT in a nastech-agent/ subdir.  Nesting
          # it was the bug: the fork .gitignore has `nastech-*/*`, so a
          # root-level nastech-agent/ dir was silently ignored by git add -A
          # and the PR ended up containing only the reports.
          # wipe the fork checkout (keep .git + untracked tree/ + artifact/)
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name tree \
             ! -name artifact -exec rm -rf -- {} +
          # Review evidence is for the PR body, never for the product tree:
          # keep it OUTSIDE the checkout so `git add -f -A` cannot commit it.
          # A reports/ dir committed here rode every update onto the fork
          # branch and was carried forward forever by the preserve stage.
          REPORTS="${RUNNER_TEMP}/update-reports"
          mkdir -p "$REPORTS"
          cp -a tree/nastech-agent/. .
          mv tree/UPDATE-REPORT.md "$REPORTS/UPDATE-REPORT.md"
          mv tree/GATE-REPORT.md "$REPORTS/GATE-REPORT.md"
          mv tree/SYNC-SUMMARY.md "$REPORTS/SYNC-SUMMARY.md"
          mv tree/PUBLICATION-AUTHORIZATION-RECEIPT.json "$REPORTS/PUBLICATION-AUTHORIZATION-RECEIPT.json"
          rm -rf tree artifact reports

          # A pristine copy of the finished overlay: every push attempt
          # re-derives its commit from this, so a rejected attempt never
          # leaves half-overlayed state behind for the next one.
          PRISTINE="${RUNNER_TEMP}/branded-pristine"
          rm -rf "$PRISTINE"
          mkdir -p "$PRISTINE"
          tar --exclude=./.git -cf - . | tar -C "$PRISTINE" -xf -

          # Fast-forward-only publication, three re-derive attempts.  The
          # commit lands on the seed (the branch's head when it still
          # descends from main, main itself otherwise); a rejected push
          # re-reads the remote head and retries on top of it.  History is
          # never rewritten: there is no --force on this branch, ever.
          PUSHED=0
          for ATTEMPT in 1 2 3; do
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
            git checkout -q -B "$TEST" "$SEED"
            # A branch seeded from an older main no longer descends from the
            # current one.  Record main as an ancestor with an ours-merge: the
            # tree is untouched here (the branded overlay lands next), the PR
            # diff is measured from today's main, and the push below is still
            # a fast-forward from the branch's previous head.
            if ! git merge-base --is-ancestor "$BASE_SHA" HEAD; then
              git merge -q -s ours --no-edit \
                -m "chore: reconcile $TEST with fork $BASE" "$BASE_SHA"
            fi
            find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
            cp -a "$PRISTINE"/. .
            # force-add beats the nastech-*/* gitignore pattern; -A captures
            # upstream deletions too so the PR diff = what changed (branded)
            git add -f -A
            git commit -m "chore: branded update ${SHA:+($SHA)}" || echo "nothing to commit"
            if git push "$REMOTE" "$TEST"; then
              PUSHED=1
              break
            fi
            # The remote branch moved under the attempt: re-read its head
            # and accumulate on it -- never force over it.
            git fetch "$REMOTE" "refs/heads/$TEST:refs/factory/candidate" 2>/dev/null || true
            SEED=$(pick_seed)
          done
          if [ "$PUSHED" != 1 ]; then
            echo "candidate push rejected three times: the remote branch could not be accumulated, and history must not be forced" >&2
            exit 1
          fi

          # open or update the PR test -> main on the fork
          # The pipeline derived this headline from the verified delta.  The
          # sha-only title stays as the fallback for a run whose artifact did
          # not carry one, so #344 never opens an untitled PR.
          PR_TITLE="Update ${SHA:+(${SHA:0:8})}"
          if [ -s artifact/SYNC-TITLE.md ]; then
            PR_TITLE=$(head -n 1 artifact/SYNC-TITLE.md)
          fi
          BODY_FILE="$REPORTS/SYNC-SUMMARY.md"
          if [ -s artifact/SYNC-PR-BODY.md ]; then
            BODY_FILE="artifact/SYNC-PR-BODY.md"
          fi
          PR_URL=$(gh pr list --repo "$FORK" --head "$TEST" --base "$BASE" --json url --jq '.[0].url' 2>/dev/null) || true
          if [ -n "$PR_URL" ]; then
            gh pr edit "$PR_URL" --title "$PR_TITLE" --body-file "$BODY_FILE"
          else
            gh pr create --repo "$FORK" --base "$BASE" --head "$TEST" \
              --title "$PR_TITLE" --body-file "$BODY_FILE"
          fi
          gh pr view "$FORK#$TEST" --json url --jq .url || true

      - name: Record branded baseline in the factory
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.NAS_TECH_AGENT_TOKEN }}
          UPSTREAM_SHA: ${{ inputs.upstream_sha }}
        run: |
          set -euo pipefail
          # The next run's source-evidence needs the last branded upstream
          # SHA.  It used to ride inside the product tree (root manifest.json)
          # -- run metadata in the product.  It now lives in the factory's own
          # state file; this step keeps it current right after a successful
          # update.  [skip ci] keeps the record commit from re-triggering CI.
          python3 - <<'PYEOF'
          import base64
          import json
          import os
          import urllib.error
          import urllib.request

          token = os.environ["GH_TOKEN"]
          sha = os.environ.get("UPSTREAM_SHA", "")
          if len(sha) != 40 or any(c not in "0123456789abcdef" for c in sha):
              print(f"no upstream sha to record ({sha!r}); skipping")
              raise SystemExit(0)
          repo = os.environ["GITHUB_REPOSITORY"]
          path = "state/baseline.json"
          content = base64.b64encode(
              (json.dumps({"upstream_sha": sha}, indent=2) + "\n").encode()
          ).decode()

          def api(method: str, url: str, payload: dict | None = None) -> dict:
              request = urllib.request.Request(
                  f"https://api.github.com{url}",
                  data=json.dumps(payload).encode() if payload is not None else b"",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "Content-Type": "application/json",
                      "User-Agent": "hundredways-factory",
                  },
                  method=method,
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)

          file_sha = None
          try:
              file_sha = api("GET", f"/repos/{repo}/contents/{path}")["sha"]
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  raise
          body = {
              "message": "[skip ci] chore: record branded baseline " + sha[:8],
              "content": content,
              "branch": "main",
          }
          if file_sha:
              body["sha"] = file_sha
          api("PUT", f"/repos/{repo}/contents/{path}", body)
          print(f"recorded baseline {sha} in {repo}#main:{path}")
          PYEOF
