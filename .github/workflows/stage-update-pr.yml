name: stage-update-pr

# Stage 6: when the pipeline passes, push the branded tree to a test branch
# in the nastech-agent FORK and open/update a PR against its main.  The fork
# runs its own full CI (Python slices, JS checks, E2E, CodeQL) on that PR, so
# a green result proves the freshly-branded Hermes tree is sound enough to
# merge upstream.
#
#   pipeline (artifact: nastech-agent-update) --(this)--> nasbot/update-latest (fork)
#   PR: nasbot/update-latest  ->  main  (nastechresearch/nastech-agent)
#
# NOTE: the branch must NOT be named test/update-latest — the fork already has
# a branch literally named `test`, and git rejects test/* as a directory/file
# conflict. Use a name whose parent ref does not exist (nasbot/update-latest).
#
# Cross-repo writes need a PAT (contents: write + pull-requests: write scoped
# to nastechresearch/nastech-agent) in the NAS_TECH_AGENT_TOKEN secret.
# Each successful run force-pushes the same test branch, so the PR always
# shows the latest branded tree diff against fork main.

on:
  workflow_call:
    inputs:
      upstream_sha:
        description: Upstream Hermes commit that was branded
        type: string
        required: false
        default: ""
      gate:
        description: Final gate result (PASS / FAIL)
        type: string
        required: false
        default: "PASS"

permissions:
  contents: read

jobs:
  update-pr:
    if: inputs.gate == 'PASS'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.2.2

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nastech-agent-update
          path: artifact

      - name: Extract branded tree
        run: |
          mkdir -p tree
          cd tree
          python3 - <<'EOF'
          import zipfile
          with zipfile.ZipFile("../artifact/nastech-agent-update.zip") as zf:
              zf.extractall(".")
              top = sorted(set(n.split("/", 1)[0] for n in zf.namelist()))
          print("extracted:", top)
          EOF
          # tree/ = nastech-agent/ + UPDATE-REPORT.md + GATE-REPORT.md (zip root)

      - name: Commit branded tree to fork test branch
        env:
          GH_TOKEN: ${{ secrets.NAS_TECH_AGENT_TOKEN }}
        run: |
          set -eux
          FORK="nastechresearch/nastech-agent"
          BASE="main"
          TEST="nasbot/update-latest"
          SHA="${{ inputs.upstream_sha }}"
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${FORK}.git"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # fresh branch off the fork's main, then drop the branded tree in
          git fetch "$REMOTE" "$BASE"
          git checkout -B "$TEST" "FETCH_HEAD"
          rm -rf -- nastech-agent reports artifact 2>/dev/null || true
          mkdir -p reports
          mv tree/nastech-agent ./nastech-agent
          mv tree/UPDATE-REPORT.md reports/UPDATE-REPORT.md
          mv tree/GATE-REPORT.md reports/GATE-REPORT.md
          rm -rf tree
          git add -A
          git -c user.name="github-actions[bot]" \
             -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
             commit -m "chore: branded update ${SHA:+($SHA)}" || echo "nothing to commit"

          # force-push (review branch; history is irrelevant)
          git push --force "$REMOTE" "$TEST"

          # open or update the PR test -> main on the fork
          PR_TITLE="Update ${SHA:+(${SHA:0:8})}"
          BODY="Pipeline gate: PASS. Auto-generated from the 100Ways release pipeline. Runs the fork's full CI against the freshly-branded Hermes tree."
          PR_URL=$(gh pr list --repo "$FORK" --head "$TEST" --base "$BASE" --json url --jq '.[0].url' 2>/dev/null) || true
          if [ -n "$PR_URL" ]; then
            gh pr edit "$PR_URL" --title "$PR_TITLE" --body "$BODY"
          else
            gh pr create --repo "$FORK" --base "$BASE" --head "$TEST" \
              --title "$PR_TITLE" --body "$BODY"
          fi
          gh pr view "$FORK#$TEST" --json url --jq .url || true
