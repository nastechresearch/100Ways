name: "#344 — Push PR to NasTech"

# Final step #344: after every verification stage passes, push the branded tree to a test branch
# in the nastech-agent FORK and open/update a PR against its main.  The fork
# runs its own full CI (Python slices, JS checks, E2E, CodeQL) on that PR, so
# a green result proves the freshly-branded Hermes tree is sound enough to
# merge upstream.
#
#   pipeline (artifact: nastech-agent-update) --(this)--> 100WAYS (fork)
#   PR: 100WAYS  ->  main  (nastechresearch/nastech-agent)
#
# NOTE: the branch must NOT be named test/update-latest — the fork already has
# a branch literally named `test`, and git rejects test/* as a directory/file
# conflict. Use a name whose parent ref does not exist (100WAYS).
#
# Cross-repo writes need a PAT (contents: write + pull-requests: write scoped
# to nastechresearch/nastech-agent) in the NAS_TECH_AGENT_TOKEN secret.
# Each successful run force-pushes the same test branch, so the PR always
# shows the latest branded tree diff against fork main.

on:
  workflow_call:
    inputs:
      upstream_sha:
        description: Upstream Hermes commit that was branded
        type: string
        required: false
        default: ""
      gate:
        description: Final gate result (PASS / FAIL)
        type: string
        required: false
        default: "PASS"
      inherited_collision_acknowledged:
        description: Explicit acknowledgement for review-only inherited case-collision evidence
        type: boolean
        required: false
        default: false
    secrets:
      NAS_TECH_AGENT_TOKEN:
        description: Cross-repository PR token, scoped only to nastech-agent
        required: false

permissions:
  contents: read

jobs:
  update-pr:
    if: inputs.gate == 'PASS'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          # Critical: without this, checkout writes http.extraheader with the
          # GITHUB_TOKEN, which OVERRIDES the PAT embedded in our remote URL on
          # every request. The push then authenticates as github-actions[bot]
          # (read works on public repos, write 403s). The PAT in the URL is
          # the only credential we want here.
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nastech-agent-update
          path: artifact

      - name: Extract branded tree
        run: |
          mkdir -p tree
          cd tree
          python3 - <<'EOF'
          import os
          import zipfile
          with zipfile.ZipFile("../artifact/nastech-agent-update.zip") as zf:
              zf.extractall(".")
              for info in zf.infolist():
                  mode = (info.external_attr >> 16) & 0o777
                  path = os.path.abspath(info.filename)
                  if mode and os.path.isfile(path):
                      os.chmod(path, mode)
              top = sorted(set(n.split("/", 1)[0] for n in zf.namelist()))
          print("extracted:", top)
          EOF
          # tree/ = nastech-agent/ + verification reports + professional summary (zip root)

      # Pull requests from forks do not receive repository secrets.  The
      # cross-repository PAT is therefore unavailable (or intentionally
      # invalid) in this validation context.  Keep the CI stage green and
      # reserve the write operation for trusted push, schedule, and manual
      # runs where the secret is available.
      - name: Skip cross-repository update for fork pull requests
        if: github.event_name == 'pull_request'
        run: echo "Skipping cross-repository update for fork pull request; repository secrets are unavailable."

      - name: Verify gate receipt and write #344 authorization
        if: github.event_name != 'pull_request'
        env:
          UPSTREAM_SHA: ${{ inputs.upstream_sha }}
          INHERITED_COLLISION_ACKNOWLEDGED: ${{ inputs.inherited_collision_acknowledged }}
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import os
          from hundredways.receipts import write_publication_authorization_receipt

          write_publication_authorization_receipt(
              "tree/PUBLICATION-AUTHORIZATION-RECEIPT.json",
              gate_receipt_path="artifact/gate_receipt.json",
              artifact_path="artifact/nastech-agent-update.zip",
              upstream_sha=os.environ["UPSTREAM_SHA"],
              candidate_branch="100WAYS",
              target_repository="nastechresearch/nastech-agent",
              target_base="main",
              inherited_collision_acknowledged=(
                  os.environ["INHERITED_COLLISION_ACKNOWLEDGED"].lower() == "true"
              ),
          )
          PYEOF

      - name: Commit branded tree to fork test branch
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.NAS_TECH_AGENT_TOKEN }}
        run: |
          set -eux
          FORK="nastechresearch/nastech-agent"
          BASE="main"
          TEST="100WAYS"
          SHA="${{ inputs.upstream_sha }}"
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${FORK}.git"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # fresh branch off the fork's main, then drop the branded tree in
          git fetch "$REMOTE" "$BASE"
          git checkout -B "$TEST" "FETCH_HEAD"

          # Overlay the branded tree ONTO the checkout root.  The zip's
          # nastech-agent/ folder IS the whole project — the fork's content
          # lives at the repo root, NOT in a nastech-agent/ subdir.  Nesting
          # it was the bug: the fork .gitignore has `nastech-*/*`, so a
          # root-level nastech-agent/ dir was silently ignored by git add -A
          # and the PR ended up containing only the reports.
          # wipe the fork checkout (keep .git + untracked tree/ + artifact/)
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name tree \
             ! -name artifact -exec rm -rf -- {} +
          mkdir -p reports
          cp -a tree/nastech-agent/. .
          mv tree/UPDATE-REPORT.md reports/UPDATE-REPORT.md
          mv tree/GATE-REPORT.md reports/GATE-REPORT.md
          mv tree/SYNC-SUMMARY.md reports/SYNC-SUMMARY.md
          mv tree/PUBLICATION-AUTHORIZATION-RECEIPT.json reports/PUBLICATION-AUTHORIZATION-RECEIPT.json
          rm -rf tree artifact

          # force-add beats the nastech-*/* gitignore pattern; -A captures
          # upstream deletions too so the PR diff = what changed (branded)
          git add -f -A
          git -c user.name="github-actions[bot]" \
             -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
             commit -m "chore: branded update ${SHA:+($SHA)}" || echo "nothing to commit"

          # force-push (review branch; history is irrelevant)
          git push --force "$REMOTE" "$TEST"

          # open or update the PR test -> main on the fork
          PR_TITLE="Update ${SHA:+(${SHA:0:8})}"
          BODY_FILE="reports/SYNC-SUMMARY.md"
          PR_URL=$(gh pr list --repo "$FORK" --head "$TEST" --base "$BASE" --json url --jq '.[0].url' 2>/dev/null) || true
          if [ -n "$PR_URL" ]; then
            gh pr edit "$PR_URL" --title "$PR_TITLE" --body-file "$BODY_FILE"
          else
            gh pr create --repo "$FORK" --base "$BASE" --head "$TEST" \
              --title "$PR_TITLE" --body-file "$BODY_FILE"
          fi
          gh pr view "$FORK#$TEST" --json url --jq .url || true
