name: stage-forkcheck

# Stage 6: prove the freshly-branded tree installs and PASSES the nastech-agent
# fork's own test suite — before it is pushed as a PR.  The zip artifact is the
# branded Hermes tree; we extract it, `uv sync --locked` exactly as the fork's
# CI does (so a stale/mis-reconciled uv.lock fails here, not on the PR), boot
# `nastech` and run `nastech logs` against a temp NASTECH_HOME, then run the
# fork's real slice matrix.  Green here == the PR to the fork is green.
#
# This is the "it will pass when pushed" guarantee: the fork's own CI
# (tests.yml) is mirrored, so a passing run means the update-pr PR cannot be
# blocked on Python tests or lockfile reconcile.

on:
  workflow_call:
    inputs:
      slice_count:
        description: Number of parallel test slices (mirrors the fork's tests.yml)
        type: number
        required: false
        default: 4

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nastech-agent-update
          path: artifact

      - name: Extract branded tree
        run: |
          mkdir -p tree
          cd tree
          python3 - <<'EOF'
          import os, stat, zipfile
          with zipfile.ZipFile("../artifact/nastech-agent-update.zip") as zf:
              zf.extractall(".")
              # Python's zipfile.extractall drops exec bits, so restore every
              # file's execute bits from the stored Unix mode (scripts/run_tests.sh
              # and the parallel runner must stay executable for the test slices).
              for info in zf.infolist():
                  mode = info.external_attr >> 16
                  if mode & 0o111:
                      path = os.path.join(*info.filename.split("/"))
                      if os.path.isfile(path):
                          os.chmod(path, os.stat(path).st_mode | (mode & 0o111))
              # The zip carries no .git (it is a fresh clone of the branded tree),
              # but update-path tests (test_cmd_update, test_update_yes_flag, ...)
              # and `nastech update` check PROJECT_ROOT/.git exists before
              # running.  An empty .git dir satisfies the existence gate; git
              # subprocess calls are mocked in those tests.  Mirror the fork's
              # real git checkout so the same tests pass here.  The zip also
              # carries GATE-REPORT.md/UPDATE-REPORT.md at the top level, so
              # pick the top-level directory (the tree), not a report file.
              top = sorted(
                  set(n.split("/", 1)[0] for n in zf.namelist() if "/" in n)
              )
              tree_dir = next(
                  (t for t in top if os.path.isdir(t)), None
              )
              if tree_dir:
                  os.makedirs(os.path.join(tree_dir, ".git"), exist_ok=True)
          print("extracted:", top)
          EOF

      - name: Restore duration cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: tree/nastech-agent/test_durations.json
          key: forkcheck-test-durations

      - name: Generate test slices
        id: matrix
        run: |
          MATRIX=$(python3 tree/nastech-agent/scripts/run_tests_parallel.py --generate-slices ${{ inputs.slice_count }})
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  test:
    name: "Fork tests slice ${{ matrix.slice.index }}/${{ inputs.slice_count }}"
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.generate.outputs.matrix) }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nastech-agent-update
          path: artifact

      - name: Extract branded tree
        run: |
          mkdir -p tree
          cd tree
          python3 - <<'EOF'
          import os, stat, zipfile
          with zipfile.ZipFile("../artifact/nastech-agent-update.zip") as zf:
              zf.extractall(".")
              for info in zf.infolist():
                  mode = info.external_attr >> 16
                  if mode & 0o111:
                      path = os.path.join(*info.filename.split("/"))
                      if os.path.isfile(path):
                          os.chmod(path, os.stat(path).st_mode | (mode & 0o111))
              top = sorted(
                  set(n.split("/", 1)[0] for n in zf.namelist() if "/" in n)
              )
              tree_dir = next(
                  (t for t in top if os.path.isdir(t)), None
              )
              if tree_dir:
                  os.makedirs(os.path.join(tree_dir, ".git"), exist_ok=True)
          EOF

      - name: Install ripgrep (prebuilt binary)
        run: |
          set -euo pipefail
          RG_VERSION=15.1.0
          RG_SHA256=1c9297be4a084eea7ecaedf93eb03d058d6faae29bbc57ecdaf5063921491599
          RG_TARBALL=ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl.tar.gz
          curl -sSfL --retry 3 --retry-delay 5 -o "$RG_TARBALL" \
            "https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}/${RG_TARBALL}"
          echo "${RG_SHA256}  ${RG_TARBALL}" | sha256sum -c -
          tar -xzf "$RG_TARBALL"
          sudo mv "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl/rg" /usr/local/bin/rg
          rm -rf "$RG_TARBALL" "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl"
          rg --version

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          version: "0.9.28"
          enable-cache: true
          cache-dependency-glob: |
            tree/nastech-agent/pyproject.toml
            tree/nastech-agent/uv.lock

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies (mirrors the fork's tests.yml)
        working-directory: tree/nastech-agent
        run: |
          uv sync --locked --python 3.11 --extra all --extra dev --extra anthropic --extra mistral --extra fal --extra modal --extra daytona --extra hindsight --extra parallel-web

      - name: Run tests (slice ${{ matrix.slice.index }}/${{ inputs.slice_count }})
        working-directory: tree/nastech-agent
        run: |
          source .venv/bin/activate
          scripts/run_tests.sh --files '${{ matrix.slice.files }}'
        env:
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NASTECH_API_KEY: ""

      - name: Upload per-slice durations
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: forkcheck-test-durations-slice-${{ matrix.slice.index }}
          path: tree/nastech-agent/test_durations.json
          retention-days: 1

  smoke:
    name: "Boot nastech + nastech logs"
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nastech-agent-update
          path: artifact

      - name: Extract branded tree
        run: |
          mkdir -p tree
          cd tree
          python3 - <<'EOF'
          import os, stat, zipfile
          with zipfile.ZipFile("../artifact/nastech-agent-update.zip") as zf:
              zf.extractall(".")
              for info in zf.infolist():
                  mode = info.external_attr >> 16
                  if mode & 0o111:
                      path = os.path.join(*info.filename.split("/"))
                      if os.path.isfile(path):
                          os.chmod(path, os.stat(path).st_mode | (mode & 0o111))
              top = sorted(
                  set(n.split("/", 1)[0] for n in zf.namelist() if "/" in n)
              )
              tree_dir = next(
                  (t for t in top if os.path.isdir(t)), None
              )
              if tree_dir:
                  os.makedirs(os.path.join(tree_dir, ".git"), exist_ok=True)
          EOF

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          version: "0.9.28"
          enable-cache: true
          cache-dependency-glob: |
            tree/nastech-agent/pyproject.toml
            tree/nastech-agent/uv.lock

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies (mirrors the fork's tests.yml)
        working-directory: tree/nastech-agent
        run: |
          uv sync --locked --python 3.11 --extra all --extra dev --extra anthropic --extra mistral --extra fal --extra modal --extra daytona --extra hindsight --extra parallel-web

      - name: Boot the branded CLI and read its logs
        working-directory: tree/nastech-agent
        run: |
          source .venv/bin/activate
          # Python's zipfile.extractall drops exec bits; restore the launcher's.
          chmod +x nastech
          export NASTECH_HOME="$RUNNER_TEMP/nastech-home"
          export HOME="$RUNNER_TEMP"
          ./nastech --version
          ./nastech logs 2>&1 | head -20
          ./nastech logs list 2>&1 | head -20
        env:
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NASTECH_API_KEY: ""

  save-durations:
    needs: [test, generate]
    if: always() && needs.generate.result == 'success' && needs.test.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: forkcheck-test-durations-slice-*
          path: durations
          merge-multiple: true

      - name: Merge into single durations file
        run: |
          python3 -c "
          import json, glob, os
          merged = {}
          for f in glob.glob('durations/*test_durations.json'):
            with open(f) as fh:
              merged.update(json.load(fh))
          with open('test_durations.json', 'w') as fh:
            json.dump(merged, fh, indent=2, sort_keys=True)
          print(f'Merged {len(merged)} file durations')
          "

      - name: Save merged duration cache
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: test_durations.json
          key: forkcheck-test-durations
