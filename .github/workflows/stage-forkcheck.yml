name: stage-forkcheck

# Stage 6: prove the freshly-branded tree installs and PASSES the nastech-agent
# fork's own test suite — before it is pushed as a PR.  The zip artifact is the
# branded Hermes tree; we extract it and provision the candidate's pm
# toolchain + test environment exactly as the candidate's OWN CI (tests.yml ->
# setup-pm) does — the tree's stdlib-only scripts/ci/setup_toolchain.py locked
# install into a sibling forkcheck-pm-home, then a locked --test-environment
# build with the full extras list.  A stale/mis-reconciled uv.lock fails here
# (frozen pm sync), not on the PR.  We boot `nastech` and run `nastech logs`
# against a temp NASTECH_HOME, then run the fork's real slice matrix.  Green
# here == the PR to the fork is green.
#
# This is the "it will pass when pushed" guarantee: the fork's own CI
# (tests.yml) is mirrored, so a passing run means the update-pr PR cannot be
# blocked on Python tests or lockfile reconcile.
#
# The suite is driven through NASTECH_PYTHON (the pm test-environment venv
# python exported by the Build step) with HOME pointed at an EMPTY guarded
# root.  run_tests.sh honors NASTECH_PYTHON directly and never re-execs, so no
# pm or machine state is ever built into the guarded home and the candidate's
# own tests/home_io_guard.py stays inert.  A checkout-local `uv sync` + .venv
# would defeat this: without NASTECH_PYTHON, run_tests.sh re-execs through the
# tree's pm machinery, which builds its test environment under $HOME/.nastech
# — exactly the real-home I/O the guard refuses.

on:
  workflow_call:
    inputs:
      slice_count:
        description: Number of parallel test slices (mirrors the fork's tests.yml)
        type: number
        required: false
        default: 4

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nastech-agent-update
          path: artifact

      - name: Extract branded tree
        run: |
          mkdir -p tree
          cd tree
          python3 - <<'EOF'
          import os, stat, subprocess, zipfile
          with zipfile.ZipFile("../artifact/nastech-agent-update.zip") as zf:
              zf.extractall(".")
              # Python's zipfile.extractall drops exec bits, so restore every
              # file's execute bits from the stored Unix mode (scripts/run_tests.sh
              # and the parallel runner must stay executable for the test slices).
              for info in zf.infolist():
                  mode = info.external_attr >> 16
                  if mode & 0o111:
                      path = os.path.join(*info.filename.split("/"))
                      if os.path.isfile(path):
                          os.chmod(path, os.stat(path).st_mode | (mode & 0o111))
              # The zip carries no .git. Mirror what actions/checkout gives
              # upstream Hermes CI: a working `.git/` so `git check-ignore`,
              # `git ls-files`, and similar git-subprocess calls work. The
              # upstream test test_repo_gitignores_the_legacy_bin_dir (and
              # scripts/run_tests.sh's `git ls-files` cache step) both fail
              # with rc=128 against an empty .git/ stub. Init + add + commit
              # makes the tree a real repo matching the upstream environment.
              top = sorted(
                  set(n.split("/", 1)[0] for n in zf.namelist() if "/" in n)
              )
              tree_dir = next(
                  (t for t in top if os.path.isdir(t)), None
              )
              if tree_dir:
                  subprocess.run(
                      ["git", "-C", tree_dir, "init", "-q", "--initial-branch=main"],
                      check=True,
                  )
                  subprocess.run(
                      ["git", "-C", tree_dir, "config", "user.email",
                       "forkcheck@100ways.local"],
                      check=True,
                  )
                  subprocess.run(
                      ["git", "-C", tree_dir, "config", "user.name",
                       "100Ways Forkcheck"],
                      check=True,
                  )
                  subprocess.run(
                      ["git", "-C", tree_dir, "add", "-A"],
                      check=True,
                  )
                  subprocess.run(
                      ["git", "-C", tree_dir, "commit", "-q",
                       "-m", "forkcheck: snapshot of branded candidate"],
                      check=True,
                  )
          print("extracted:", top)
          EOF

      - name: Restore duration cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: tree/nastech-agent/test_durations.json
          key: forkcheck-test-durations

      - name: Generate test slices
        id: matrix
        run: |
          MATRIX=$(python3 tree/nastech-agent/scripts/run_tests_parallel.py --generate-slices ${{ inputs.slice_count }})
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  test:
    name: "Fork tests slice ${{ matrix.slice.index }}/${{ inputs.slice_count }}"
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.generate.outputs.matrix) }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nastech-agent-update
          path: artifact

      - name: Extract branded tree
        run: |
          mkdir -p tree
          cd tree
          python3 - <<'EOF'
          import os, stat, subprocess, zipfile
          with zipfile.ZipFile("../artifact/nastech-agent-update.zip") as zf:
              zf.extractall(".")
              for info in zf.infolist():
                  mode = info.external_attr >> 16
                  if mode & 0o111:
                      path = os.path.join(*info.filename.split("/"))
                      if os.path.isfile(path):
                          os.chmod(path, os.stat(path).st_mode | (mode & 0o111))
              top = sorted(
                  set(n.split("/", 1)[0] for n in zf.namelist() if "/" in n)
              )
              tree_dir = next(
                  (t for t in top if os.path.isdir(t)), None
              )
              if tree_dir:
                  subprocess.run(
                      ["git", "-C", tree_dir, "init", "-q", "--initial-branch=main"],
                      check=True,
                  )
                  subprocess.run(
                      ["git", "-C", tree_dir, "config", "user.email",
                       "forkcheck@100ways.local"],
                      check=True,
                  )
                  subprocess.run(
                      ["git", "-C", tree_dir, "config", "user.name",
                       "100Ways Forkcheck"],
                      check=True,
                  )
                  subprocess.run(
                      ["git", "-C", tree_dir, "add", "-A"],
                      check=True,
                  )
                  subprocess.run(
                      ["git", "-C", tree_dir, "commit", "-q",
                       "-m", "forkcheck: snapshot of branded candidate"],
                      check=True,
                  )
          EOF

      - name: Install ripgrep (prebuilt binary)
        run: |
          set -euo pipefail
          RG_VERSION=15.1.0
          RG_SHA256=1c9297be4a084eea7ecaedf93eb03d058d6faae29bbc57ecdaf5063921491599
          RG_TARBALL=ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl.tar.gz
          curl -sSfL --retry 3 --retry-delay 5 -o "$RG_TARBALL" \
            "https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}/${RG_TARBALL}"
          echo "${RG_SHA256}  ${RG_TARBALL}" | sha256sum -c -
          tar -xzf "$RG_TARBALL"
          sudo mv "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl/rg" /usr/local/bin/rg
          rm -rf "$RG_TARBALL" "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl"
          rg --version

      - name: Provision forkcheck PM toolchain
        run: |
          # The tree's own scripts/ci/setup_toolchain.py is the stdlib-only PM
          # bootstrap that upstream's setup-pm action drives; this installs the
          # locked python/uv toolchain into --home (forkcheck-pm-home) and
          # exports NASTECH_PYTHON (the bare command interpreter) plus the tool
          # bins on PATH for the steps below.
          set -euo pipefail
          test -f "$GITHUB_WORKSPACE/tree/nastech-agent/scripts/ci/setup_toolchain.py"
          python3 -S "$GITHUB_WORKSPACE/tree/nastech-agent/scripts/ci/setup_toolchain.py" install \
            --toolchain python --home "$RUNNER_TEMP/forkcheck-pm-home"

      - name: Build forkcheck PM test environment
        working-directory: tree/nastech-agent
        run: |
          # Mirror of upstream CI (tests.yml -> setup-pm): build the pm
          # test-environment with the dev+test groups AND the full extras list,
          # then run the suite at it through NASTECH_PYTHON. run_tests.sh
          # honors NASTECH_PYTHON directly and never re-execs, so no pm or
          # machine state is ever built into the guarded forkcheck home. The
          # extras list is the candidate's exact set; without it the
          # parallel-web / fal / bedrock SDK probes (`pm.extras.available` is
          # an import probe in the running interpreter) fail.
          set -euo pipefail
          "$NASTECH_PYTHON" -S "$GITHUB_WORKSPACE/tree/nastech-agent/scripts/ci/setup_toolchain.py" dependencies \
            --toolchain python \
            --extras '["all", "anthropic", "bedrock", "mistral", "fal", "modal", "daytona", "parallel-web"]' \
            --home "$RUNNER_TEMP/forkcheck-pm-home" \
            --test-environment

      - name: Prompt-resume compatibility gate
        if: matrix.slice.index == 1
        working-directory: tree/nastech-agent
        run: |
          # The suite's home-io guard (tests/home_io_guard.py) refuses any test
          # file I/O that lands in the REAL nastech home. NASTECH_PYTHON (from
          # the Build step) makes run_tests.sh run this file under the pm
          # test-environment directly - no pm re-exec - so a fresh HOME stays
          # empty and the guard stays inert.
          mkdir -p "$RUNNER_TEMP/forkcheck-home"
          export HOME="$RUNNER_TEMP/forkcheck-home"
          ./scripts/run_tests.sh tests/agent/test_plugin_prompt_sections.py
        env:
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NASTECH_API_KEY: ""
          NASTECH_TEST_WORKERS: "2"
          NASTECH_TEST_FILE_RETRIES: "2"

      - name: Run tests (slice ${{ matrix.slice.index }}/${{ inputs.slice_count }})
        working-directory: tree/nastech-agent
        run: |
          mkdir -p "$RUNNER_TEMP/forkcheck-home"
          export HOME="$RUNNER_TEMP/forkcheck-home"
          ./scripts/run_tests.sh --files '${{ matrix.slice.files }}'
        env:
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NASTECH_API_KEY: ""
          NASTECH_TEST_WORKERS: "2"
          NASTECH_TEST_FILE_RETRIES: "2"

      - name: Upload per-slice durations
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: forkcheck-test-durations-slice-${{ matrix.slice.index }}
          path: tree/nastech-agent/test_durations.json
          retention-days: 1

  smoke:
    name: "Boot nastech + nastech logs"
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nastech-agent-update
          path: artifact

      - name: Extract branded tree
        run: |
          mkdir -p tree
          cd tree
          python3 - <<'EOF'
          import os, stat, subprocess, zipfile
          with zipfile.ZipFile("../artifact/nastech-agent-update.zip") as zf:
              zf.extractall(".")
              for info in zf.infolist():
                  mode = info.external_attr >> 16
                  if mode & 0o111:
                      path = os.path.join(*info.filename.split("/"))
                      if os.path.isfile(path):
                          os.chmod(path, os.stat(path).st_mode | (mode & 0o111))
              top = sorted(
                  set(n.split("/", 1)[0] for n in zf.namelist() if "/" in n)
              )
              tree_dir = next(
                  (t for t in top if os.path.isdir(t)), None
              )
              if tree_dir:
                  subprocess.run(
                      ["git", "-C", tree_dir, "init", "-q", "--initial-branch=main"],
                      check=True,
                  )
                  subprocess.run(
                      ["git", "-C", tree_dir, "config", "user.email",
                       "forkcheck@100ways.local"],
                      check=True,
                  )
                  subprocess.run(
                      ["git", "-C", tree_dir, "config", "user.name",
                       "100Ways Forkcheck"],
                      check=True,
                  )
                  subprocess.run(
                      ["git", "-C", tree_dir, "add", "-A"],
                      check=True,
                  )
                  subprocess.run(
                      ["git", "-C", tree_dir, "commit", "-q",
                       "-m", "forkcheck: snapshot of branded candidate"],
                      check=True,
                  )
          EOF

      - name: Provision forkcheck PM toolchain
        run: |
          set -euo pipefail
          test -f "$GITHUB_WORKSPACE/tree/nastech-agent/scripts/ci/setup_toolchain.py"
          python3 -S "$GITHUB_WORKSPACE/tree/nastech-agent/scripts/ci/setup_toolchain.py" install \
            --toolchain python --home "$RUNNER_TEMP/forkcheck-pm-home"

      - name: Build forkcheck PM test environment
        working-directory: tree/nastech-agent
        run: |
          set -euo pipefail
          "$NASTECH_PYTHON" -S "$GITHUB_WORKSPACE/tree/nastech-agent/scripts/ci/setup_toolchain.py" dependencies \
            --toolchain python \
            --extras '["all", "anthropic", "bedrock", "mistral", "fal", "modal", "daytona", "parallel-web"]' \
            --home "$RUNNER_TEMP/forkcheck-pm-home" \
            --test-environment

      - name: Boot the branded CLI and read its logs
        working-directory: tree/nastech-agent
        run: |
          # NASTECH_PYTHON and the pm tool bins are on PATH from the Build
          # step, so `nastech` (a /usr/bin/env python3 launcher) resolves to
          # the pm test-environment interpreter with the full runtime deps.
          # Python's zipfile.extractall drops exec bits; restore the launcher's.
          chmod +x nastech
          export NASTECH_HOME="$RUNNER_TEMP/nastech-home"
          export HOME="$RUNNER_TEMP"
          ./nastech --version
          ./nastech logs 2>&1 | head -20
          ./nastech logs list 2>&1 | head -20
        env:
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NASTECH_API_KEY: ""

  save-durations:
    needs: [test, generate]
    if: always() && needs.generate.result == 'success' && needs.test.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: forkcheck-test-durations-slice-*
          path: durations
          # Each slice emits the same filename. Keep artifact directories so
          # download-artifact never concatenates separate JSON documents.
          merge-multiple: false

      - name: Merge into single durations file
        run: |
          python3 -c "
          import json
          from pathlib import Path

          files = sorted(Path('durations').glob('*/test_durations.json'))
          if not files:
              raise SystemExit('No per-slice duration artifacts were downloaded')

          merged = {}
          for path in files:
              with path.open(encoding='utf-8') as fh:
                  payload = json.load(fh)
              if not isinstance(payload, dict):
                  raise SystemExit(f'Expected object in {path}')
              merged.update(payload)

          with open('test_durations.json', 'w', encoding='utf-8') as fh:
              json.dump(merged, fh, indent=2, sort_keys=True)
          print(f'Merged {len(files)} duration artifacts and {len(merged)} file durations')
          "

      - name: Save merged duration cache
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: test_durations.json
          key: forkcheck-test-durations
