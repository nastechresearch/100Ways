name: stage-rules

# Stage 4: prove the branding rules still reproduce the fork birth commit
# (0cafd22fb from parent 03fa32c92).  Clones the public nastech-agent fork
# with a blobless filter and runs `100ways verify` against it.  Fails if
# any file drifts from the birth tree or the pass ratio drops < 0.99.

on:
  workflow_call:

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.2.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install 100ways
        run: pip install -e .

      - name: Blobless clone of the fork (birth commit is on main)
        run: |
          git clone --filter=blob:none --no-checkout \
            https://github.com/nastechresearch/nastech-agent.git nastech-agent

      - name: Verify rebrand parity vs birth commit
        run: |
          python3 - <<'EOF'
          from hundredways.cli import BIRTH_COMMIT, BIRTH_PARENT
          from hundredways.rules import BrandingRules
          from hundredways.verify import verify_rebrand
          import os
          repo = os.path.join(os.getcwd(), "nastech-agent")
          report = verify_rebrand(repo, BIRTH_PARENT, BIRTH_COMMIT, BrandingRules())
          print(report.summary())

          # The fork birth commit manually rewrote a fixed set of files
          # (i18n bundles, READMEs, deleted contributor-email data).  The
          # rules gate is a DRIFT monitor: it must stay >= 99% and the set
          # of drifted files must never grow.  A brand-rule regression
          # either drops the ratio or adds new drift -> CI fails.
          allowlist = {
              "README.es.md", "README.md", "README.ur-pk.md", "README.zh-CN.md",
              "apps/desktop/src/app/command-center/index.tsx",
              "apps/desktop/src/components/ui/decode-text.tsx",
              "apps/desktop/src/i18n/ar.ts", "apps/desktop/src/i18n/en.ts",
              "apps/desktop/src/i18n/ja.ts", "apps/desktop/src/i18n/types.ts",
              "apps/desktop/src/i18n/zh-hant.ts", "apps/desktop/src/i18n/zh.ts",
              "apps/desktop/src/plugins/hello-runtime/plugin.runtime.js",
              "contributors/emails/hermesagent424@gmail.com",
              "contributors/emails/mchermes@edu.dreamcatcher.ai",
              "cron/lifecycle_guard.py", "evals/readtool/README.md",
              "nastech_cli/config.py", "nastech_cli/mcp_security.py",
              "nastech_cli/profiles.py", "nastech_cli/uninstall.py",
              "optional-skills/creative/baoyu-comic/references/base-prompt.md",
              "optional-skills/creative/baoyu-comic/references/storyboard-template.md",
              "optional-skills/security/web-pentest/references/exploitation-techniques.md",
              "scripts/contributor_audit.py", "scripts/release.py",
              "skills/creative/ascii-video/SKILL.md",
              "skills/creative/manim-video/references/animation-design-thinking.md",
              "skills/creative/popular-web-designs/templates/composio.md",
              "skills/creative/popular-web-designs/templates/expo.md",
              "skills/creative/popular-web-designs/templates/linear.app.md",
              "skills/creative/popular-web-designs/templates/mintlify.md",
              "tests/gateway/test_irc_adapter.py",
              "tests/nastech_cli/test_gateway_restart_loop.py",
              "tests/nastech_cli/test_profiles.py",
              "tests/nastech_cli/test_update_import_guard.py",
              "tests/tui_gateway/test_gateway_owned_session_reap.py",
              "tools/approval.py",
              "ui-tui/packages/nastech-ink/src/ink/ink.tsx",
              "ui-tui/src/gatewayClient.ts",
              "website/docs/user-guide/features/voice-mode.md",
              "website/docs/user-guide/skills/bundled/creative/creative-ascii-video.md",
              "website/i18n/zh-Hans/docusaurus-plugin-content-docs/current/user-guide/features/voice-mode.md",
              "website/src/data/userStories.json",
              "web/src/i18n/af.ts", "web/src/i18n/ar.ts", "web/src/i18n/de.ts",
              "web/src/i18n/en.ts", "web/src/i18n/es.ts", "web/src/i18n/fr.ts",
              "web/src/i18n/ga.ts", "web/src/i18n/hu.ts", "web/src/i18n/it.ts",
              "web/src/i18n/ja.ts", "web/src/i18n/ko.ts", "web/src/i18n/pt.ts",
              "web/src/i18n/ru.ts", "web/src/i18n/tr.ts", "web/src/i18n/types.ts",
              "web/src/i18n/uk.ts", "web/src/i18n/zh-hant.ts", "web/src/i18n/zh.ts",
              "web/src/index.css", "web/src/pages/AnalyticsPage.tsx",
          }
          drifted = {f.mapped_path for f in report.failed}
          new_drift = drifted - allowlist
          if report.pass_ratio < 0.99:
              raise SystemExit(f"parity {report.pass_ratio:.3f} < 0.99")
          if new_drift:
              raise SystemExit(f"drift grew, new files: {sorted(new_drift)}")
          print(f"rules gate: PASS (parity {report.pass_ratio:.1%}, "
                f"{len(drifted)} known drift, {report.locked} locked)")
          EOF
