name: stage-rules

# Stage 4: enforce the pinned, pure Hermes-to-Nastech branding contract.
# The golden snapshot is generated from Hermes only, plus the visual assets
# explicitly registered in config/owned-assets/manifest.json. No fork tree,
# reconciliation, or file-preservation input is part of this gate.

on:
  workflow_call:

jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.2.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install 100ways
        run: pip install -e .

      - name: Fetch the pinned Hermes snapshot
        id: source
        shell: bash
        run: |
          set -euo pipefail
          HERMES_URL=$(python3 -c 'import json; print(json.load(open("config/pure-brand-baseline.json", encoding="utf-8"))["hermes_repository"])')
          HERMES_SHA=$(python3 -c 'import json; print(json.load(open("config/pure-brand-baseline.json", encoding="utf-8"))["hermes_commit"])')
          git init --quiet hermes-source
          git -C hermes-source remote add origin "$HERMES_URL"
          git -C hermes-source fetch --depth=1 origin "$HERMES_SHA"
          git -C hermes-source checkout --quiet --detach "$HERMES_SHA"
          test "$(git -C hermes-source rev-parse HEAD)" = "$HERMES_SHA"
          echo "sha=$HERMES_SHA" >> "$GITHUB_OUTPUT"
          echo "- Pinned Hermes source: \`$HERMES_SHA\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify pure-brand snapshot and exact conformance
        run: python3 scripts/check_pure_brand_snapshot.py --source hermes-source
